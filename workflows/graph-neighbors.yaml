name: graph_neighbors
description: >
  同步查詢：給一個節點 → 直接向 KBDB 的 /graph/neighbors/:node 端點要「這個節點的鄰居」→
  同步回鄰居清單。這是「查詢面工作流」示範：查詢端點不必是框架寫死的 route，可以是一條
  workflow.yaml。取代 graph plugin 內建的 GET /graph/neighbors，也取代本檔 2026-08-27 之前
  「撈全表三元組 → 記憶體 BFS」的舊做法（見下方 inkstone/Arcrun#168 一段）。

# ══════════════════════════════════════════════════════════════════════════════
# ⚠️ 先改成你自己的 KBDB URL（self-hosted 必看）
#   fetch_neighbors 的 base URL 走 {{input.kbdb_base}} 參數（每次呼叫帶），**沒有寫死官方庫**。
#   照抄本示範時，把觸發參數 kbdb_base 換成你自己部署的 KBDB 對外 URL——
#   抄了別人的值＝你的查詢與資料流向直接打進別人的庫（KBDB_BASE_URL fallback 同家族坑）。
# ══════════════════════════════════════════════════════════════════════════════

# ── 1042 與 kbdb_base 該帶哪種 URL ──
# cypher-executor 執行 http_request 節點時對 kbdb 發 fetch。若打同 zone URL 會踩 CF 1042
# （same-zone self-fetch）。兩條路皆可：
#   a) 帶 KBDB 的 custom domain（跨 zone、走公網前門，天然避開 1042）；
#   b) self-hosted 有 `global_fetch_strictly_public` compatibility flag
#      （credential-primitives-wasm Phase 7，cypher wrangler.toml），開了之後
#      workers.dev URL 亦可直接帶。

# ── 觸發（同步查詢 trigger，非 202）──
#   GET  https://{你的-cypher-domain}/q/{namespace}/graph_neighbors?node=Arcrun&depth=2&template=triplet&namespace={namespace}&kbdb_base=https://{你的-kbdb-domain}
#   POST https://{你的-cypher-domain}/webhooks/named/graph_neighbors/query
#        -H "X-Arcrun-API-Key: {namespace}"
#        -d '{"node":"Arcrun","depth":2,"template":"triplet","namespace":"{namespace}","kbdb_base":"https://{你的-kbdb-domain}"}'
#   → 直接回最終節點輸出。⚠️ `code` 零件的原始輸出會多包一層 `{success, data:{...}}`，
#     所以同步查詢端點拿到的是 `{success:true, data:{success,start,depth,directed,neighbors,edges,count}}`。
#     portal 圖譜模式不受影響（`mapGraphWorkflowOutput` 本來就會剝這一層再讀 neighbors／edges）。
#   （敏感輸入用 POST /query：GET /q/ 的 query string 會進各層 log，見 description.md。）

# ══════════════════════════════════════════════════════════════════════════════
# 🔴 inkstone/Arcrun#168（2026-08-27）——為什麼把「撈全表 → 記憶體 BFS」整段拿掉
#
# 舊做法：fetch_triplets 打 GET /records/by-template/:template（`ORDER BY created_at DESC
# LIMIT N`），把整批三元組塞進 code 節點做 BFS。**這條路只看得到「這個租戶最新的 N 筆」**
# ⇒ 三元組越寫越多，越舊的實體越先被擠出視窗，跟它的內容對不對、標記對不對完全無關。
#
# 實測（youlin `yuga3bse`，2026-08-27，不是推論）：
#   總筆數 226；`[[小果被AFTEE詐貸]]`（2026-07-28 收的）的三條三元組排名 99／100／101，
#   剛好卡在 limit=100 的門檻上 ⇒ 同一分鐘內，今天寫的節點查得到 4 個鄰居、7 月底寫的查到 0 個。
#
# 🔴 **調大 limit 不是解，已被真資料證偽兩次**：226 筆打包成這支零件要吃的形狀是
#   **68,387 bytes**，已超過 `http_request` 零件輸出緩衝區 65,536 的 cap（超過就 trap 成
#   `unreachable`，見 `inkstone/arcrun-rag#104`）⇒ 調到 500 只會讓這支查詢自己壞掉，
#   從「查不到舊資料」變成「整條查詢壞掉」。
#
# 修法：KBDB 新增 `GET /graph/neighbors/:node`（`kbdb/src/actions/graph-query.ts`，
# `inkstone/Arcrun#172` 已併入 matrix/arcrun main）——**反過來從節點名直接查**，
# 逐跳只查上一跳新發現的節點（走 `idx_entries_content` ＋既有 `idx_entries_rel_dst` 兩層索引）。
# ⇒ 回應大小只跟**實際鄰居數量**成正比，不跟租戶三元組總數或資料新舊有任何關係。
# ⇒ 這支 workflow 因此不再需要 `limit`，也不再需要在記憶體裡建鄰接表。
# ══════════════════════════════════════════════════════════════════════════════

flow:
  - "input >> ON_SUCCESS >> prep"
  - "prep >> ON_SUCCESS >> fetch_neighbors"
  - "fetch_neighbors >> ON_SUCCESS >> parse_neighbors"

config:
  # 0) 節點名進 URL **路徑**之前先 encodeURIComponent——與 rag_takedown_direct 的 prep
  #    同一條既有慣例（`agent-memory §7` 實撞教訓）。卡片標題會出現 `#`／`?`／`%`／空白，
  #    `#` 沒編碼就是 URL 片段起點 ⇒ 後半整段（含 query string）被截掉 ⇒ 症狀是「查不到」。
  prep:
    component: code
    code: |
      const node = String(input.node == null ? '' : input.node).trim();
      if (!node) return { success: false, error: 'graph_neighbors 缺 node 參數' };
      const d = parseInt(String(input.depth == null ? 1 : input.depth), 10);
      const depth = Math.max(1, Math.min(Number.isFinite(d) && d > 0 ? d : 1, 10));
      const template = String(input.template == null ? '' : input.template).trim() || 'triplet';
      const directed = String(input.directed) === 'true' ? 'true' : 'false';
      return { success: true, node: node, node_enc: encodeURIComponent(node),
               depth: String(depth), template: encodeURIComponent(template), directed: directed };
    input:
      node: "{{input.node}}"
      depth: "{{input.depth}}"
      template: "{{input.template}}"
      directed: "{{input.directed}}"
    limits:
      timeout_ms: 2000
      max_output_bytes: 65536

  # 1) 向 KBDB 要「這個節點的鄰居」。BFS 在 KBDB 端做完，這裡只是把結果拿回來。
  #    回 { success, start, depth, directed, neighbors:[{node,predicate,from,depth}],
  #         edges:[{subject,predicate,object}], count }。
  #    ⚠️ template 名以實際部署的 triplet template id 為準（未帶時 KBDB 端預設 `triplet`）。
  #    ⚠️ base URL 由呼叫者帶（{{input.kbdb_base}}）——不寫死任何一家的庫（見檔頂警示）。
  fetch_neighbors:
    component: http_request
    method: GET
    url: "{{input.kbdb_base}}/graph/neighbors/{{prep.data.node_enc}}?depth={{prep.data.depth}}&template={{prep.data.template}}&directed={{prep.data.directed}}&owner_id={{input.namespace}}"
    headers:
      Accept: "application/json"

  # 2) 把 fetch_neighbors 的字串 body 解析成結構化 JSON——純局部整形
  #    （07-thin-shell §3.5「code-node：非 call-api 的純計算」），不是業務邏輯。
  parse_neighbors:
    component: code
    code: |
      // fetch_neighbors.data.body 是 KBDB /graph/neighbors/:node 回應的原始 JSON 字串。
      let body = input.body;
      if (body && typeof body === 'object') return body;
      try {
        return JSON.parse(String(body));
      } catch (e) {
        return { success: false, error: 'graph_neighbors: KBDB 回應不是合法 JSON：' + String(e) };
      }
    input:
      body: "{{fetch_neighbors.data.body}}"
    limits:
      timeout_ms: 1000
      max_output_bytes: 2097152
