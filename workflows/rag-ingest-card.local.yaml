# rag_ingest_card — 收 inline 卡片直上 D1（daemon-beta task 5，四步定稿第 4 步）
#
# 血統：rag_ingest_direct 砍掉 ask_llm/clean_card 兩節——萃取已在用戶機器本地完成
# （claude 訂閱跑 /wiki-capture 或 daemon 內建 gemma 路，見 collector/extract*.go），
# 雲端只收「已萃好的卡片」做機械切塊＋寫 KBDB。**這是四步定稿唯一的雲端改動**。
#
# 為什麼砍 LLM 節（對照 rag_ingest_direct）：
#   - 原文不過境：daemon 只送卡片，原稿留在用戶電腦（隱私＋零雲端儲存成本）。
#   - 免費層 CPU：LLM 節是用戶實例最重的一環（CP2-F），移出後本鏈只剩輕量 code+http。
#   - LLM credential 依賴消失：不需要 gemini_api_key credential（KV 蒸發事故 07-24 的教訓之一）。
#     ⚠️ 但**寫 KBDB 仍需 kbdb_internal_token**（D36：只寫 {{credential.…}}，值由 resolve_credentials 回填）。
#     t195 教訓：本檔建立時 kbdb 還沒立授權牆，所以「零 credential」曾經成立；
#     07-29 D36 立牆後修補打在 fix/cis-round3-install，**feat/daemon 沒跟上** ⇒ 收卡全 401。
#
# 觸發（daemon direct 模式，一卡一 POST）：
#   POST {cypher}/webhooks/named/__NAMESPACE__/rag_ingest_card/trigger
#     -H "X-Arcrun-API-Key: __NAMESPACE__"
#     -d '{"page_name":"報銷政策","card_content":"# 報銷政策\n## 一句話定義\n…","path":"system-dev/wiki/cards/報銷政策.md","library":"kb","machine":"youlinhsieh@Leo-MBA","machine_label":"教育部 Leo 的 Mac"}'
#   machine／machine_label 選填（`inkstone/mira#6`，leo 2026-08-18）：
#     machine＝原稿在**哪一台機器**上（比對鍵，daemon 的 machine.json 鑄好就不變）；
#     machine_label＝人看的稱呼（使用者可改，只影響顯示）。
#     舊版 daemon 不帶 ⇒ 卡上這兩格是空字串，portal 顯示「未知來源」，行為與從前一致。
#
# 佔位參數（push-demo-workflow.sh sed 代入）：__NAMESPACE__ / __KBDB_BASE__ / __CODE_URL__ / __HTTP_REQ_URL__ / __CYPHER_BASE__（c14501 B① 新增，trigger_wiki_cluster 呼叫同租戶 rag_cluster_auto 用）
# blocks/triplets 寫法與 rag_ingest / rag_ingest_direct 逐欄一致 → 檢索/圖譜一視同仁。

name: rag_ingest_card
description: >
  收本地萃好的 wiki 卡（inline card_content）→ 機械切塊寫 KBDB blocks ＋解析「## 關聯」
  寫 triplets（source_uri=kb://path，帶 library）。零 LLM（寫 KBDB 仍需 kbdb_internal_token），
  是四步定稿（本地萃卡）唯一的雲端收口。（daemon-beta task 5）

flow:
  - "input >> ON_SUCCESS >> prep"
  - "prep >> ON_SUCCESS >> list_old_blocks"
  - "list_old_blocks >> ON_SUCCESS >> list_old_triplets"
  - "list_old_triplets >> ON_SUCCESS >> pick_stale"
  - "pick_stale >> 對每個 dead_entry 並行 6 >> delete_entry"
  - "pick_stale >> 對每個 dead_record 並行 6 >> delete_record"
  # `inkstone/InkStoneCo#140` comment 10651：常數格（source_uri/status/library/machine）
  # 一張卡只建一次。刻意排在 parse_card **之前**（不是之後）：graph-executor 的
  # FOREACH 找 `rel`/`block` 清單靠兩層 fallback——先看觸發節點自己的新鮮輸出，
  # 找不到才退回累積 context 裡做「淺一層」nested scan（`getIterableFromContext`）。
  # code 節點的回傳值本身就包一層 `data`，若在 parse_card 與 FOREACH 之間插入更多
  # 「輸出也是 `{success,data}` 形狀」的節點（例如這四支 POST /entries），每一棒的
  # `...result` 展開都會把 context 頂層的 `data` 換成自己的（body 那個小物件），
  # 兩層之後 `rels` 就再也 nested-scan 不到——**已實測撞到**：` post_triplet`
  # FOREACH 拿到 0 個項目、`results:[]`，21 條三元組一條都沒送出去。
  # 修法：常數格改在 parse_card **之前**建好（值從 prep 早算好的 src_uri／
  # input.library／input.machine 取得，不依賴 parse_card 的輸出），
  # parse_card 自己觸發 FOREACH 的兩條邊維持原樣（單跳、與改動前逐字相同）；
  # pool_constants 用**具名節點參照**（`{{pool_constants.data.xxx_id}}`）而非
  # 通用鍵掃描，具名鍵不會被後面任何節點的展開覆蓋，經幾跳都拿得到。
  # inkstone/arcrun-rag#241：pick_stale 判定「這張卡跟雲端那份一模一樣」(result:true) ⇒ 走
  # skip_unchanged 收工，什麼都不寫；有變 (result:false) 才往下刪＋重寫。
  # 一樣時 pick_stale 回的 dead_entry／dead_record 都是空清單，上面兩條 FOREACH 也是空轉。
  - "pick_stale >> ON_TRUE >> skip_unchanged"
  - "pick_stale >> ON_FALSE >> post_const_source_uri"
  - "post_const_source_uri >> ON_SUCCESS >> post_const_status"
  - "post_const_status >> ON_SUCCESS >> post_const_library"
  - "post_const_library >> ON_SUCCESS >> post_const_machine"
  - "post_const_machine >> ON_SUCCESS >> pool_constants"
  - "pool_constants >> ON_SUCCESS >> parse_card"
  - "parse_card >> 對每個 block 並行 6 >> post_block"
  - "parse_card >> 對每個 rel 並行 6 >> post_triplet"
  # inkstone/arcrun-rag#13 c14501 B①：卡片解析成功後另開一條 ON_SUCCESS 分支（不影響
  # 上面兩條既有 FOREACH），內部呼叫同租戶 rag_cluster_auto（use_type=wiki）做分群、
  # 寫進 cluster_membership——不新開 Gitea webhook，觸發點就在同一個實例內。
  # 🔴 已知限制（誠實列，未解）：只有部署過 rag_cluster_auto 的實例（目前只有 youlin
  # stage）這條分支才會真的寫進 cluster_membership；`rag_cluster_auto` 尚未加進本檔
  # 最上方註解說的 compile-workflows.mjs FILES 清單，一般使用者的實例裝不到它，這條
  # 分支會打 404——但那只是**這條新分支自己**沒效果，不影響上面兩條既有分支寫
  # block/triplet（各自獨立的 ON_SUCCESS/FOREACH 邊，同 `parse_card` 的三條出邊互不
  # 牽連），**也不影響外層 rag_ingest_card 的 success**（trigger_wiki_cluster 接了
  # ON_FAIL 邊吸收失敗，見下方節點與 flow 段落 c14569 註解）。要讓一般使用者也
  # 收到分群，需要另外把 rag_cluster_auto 也編進安裝器（不在這張票的範圍內）。
  - "parse_card >> ON_SUCCESS >> prep_cluster_wiki"
  - "prep_cluster_wiki >> ON_SUCCESS >> trigger_wiki_cluster"
  # inkstone/Arcrun#60（c15303/c15318/c15319/c15326/c15437）：parse_card 成功後的第四條
  # 出邊（跟上面 block/rel 兩個 FOREACH、prep_cluster_wiki 那條互不牽連，同一個道理——
  # 各自獨立的 ON_SUCCESS 邊）。這條做「entity description ＋ 概念歸屬（LLM 判斷）」，
  # 內部呼叫獨立的 rag_entity_concept workflow（不在本圖裡插節點，理由見該檔檔頭：
  # parse_card 與既有 FOREACH 之間插入更多 POST 節點會讓 FOREACH 的 context nested-scan
  # 失準，同 trigger_wiki_cluster 的血統——內部呼叫，一般使用者的實例沒裝就 404，
  # 由 ON_FAIL 吸收，不影響外層 rag_ingest_card 的 success，也不影響卡片本身寫進 KBDB
  # （那條路徑早在 parse_card 已完成）。
  - "parse_card >> ON_SUCCESS >> prep_entity_concept"
  - "prep_entity_concept >> ON_SUCCESS >> trigger_entity_concept"
  - "prep_entity_concept >> ON_FAIL >> entity_concept_absorb_prep_fail"
  - "trigger_entity_concept >> ON_FAIL >> entity_concept_absorb_fail"
  # c14949：prep_cluster_wiki 拒收未代入樣板字串時的 ON_FAIL 邊（同下面
  # trigger_wiki_cluster 那條的精神——分群這條分支失敗不該波及外層 success，
  # 這裡用獨立的吸收節點而不是共用 wiki_cluster_absorb_fail，因為兩者失敗原因不同，
  # 共用會讓 reason 文字對不上真正發生的事）。
  - "prep_cluster_wiki >> ON_FAIL >> wiki_cluster_absorb_prep_fail"
  # inkstone/arcrun-rag#13 c14569：trigger_wiki_cluster 打的 rag_cluster_auto 尚未進
  # compile-workflows.mjs 的 FILES 清單，一般使用者的實例上這個節點會 404
  # ⇒ http_request 零件正確回 {success:false}（見 registry/components/http_request/main.go）。
  # inkstone/Arcrun#254（已併 main、待部署）讓「沒有 ON_FAIL 邊接住的節點失敗」會讓
  # 整個 execution 的外層 success 變 false——沒有這條邊的話，一般使用者每收一張卡，
  # rag_ingest_card 外層都會回 success:false（即使 block/triplet 都正常寫入）。
  # 修法：比照 rag-ingest-cards.local.yaml 的 fetch_index 用法，接一條 ON_FAIL 邊——
  # 讓「rag_cluster_auto 不存在／打不到」被吸收成正常結束，不影響外層 success。
  - "trigger_wiki_cluster >> ON_FAIL >> wiki_cluster_absorb_fail"

config:
  # ── #14 upsert 前置：先刪同 page_name 的舊資料（leo 08-04 裁「用真 DELETE，不是 deprecate」）──
  #   病：原本只有 POST ⇒ 同一份沒改過的檔每同步一次就再堆一份完整副本
  #       （實撞：搜「n8n 版本比較」回 20 筆全同一筆，內容分數一樣、只有 created_at 不同）。
  #   為什麼真刪不 deprecate：重複副本不是「舊版本」，是同一份東西灌了 20 次的垃圾，
  #       留著沒有回溯價值；kbdb 本來就有真刪（entries.ts:214／records.ts:84）。
  #
  # 先算好這張卡的 srcUri（與下面 parse_card 用同一條公式：path 缺省時退回
  # page_name + '.md'）＋ CJK 進 URL query 前必先 encodeURIComponent
  # （agent-memory §7 實撞教訓，同 rag_takedown_direct 的 prep）——
  # list_old_triplets（`inkstone/Arcrun#223`／PR #225）要拿它去查「這張卡自己的舊三元組」。
  prep:
    component: "__CODE_URL__"
    code: |
      // 入口驗證（inkstone/arcrun-rag#13 c15014 第 1 條）：呼叫端沒帶 page_name 時，模板引擎把
      // 字面的 `{{input.page_name}}` 原樣塞進來（graph-executor interpolateString），對 `||` 是 truthy，
      // 舊寫法因此把那串字面文字當成真的頁名寫進知識庫。prep 是整張卡進 KBDB 前的第一個節點，在這裡擋。
      // code 零件只有 throw 才算節點失敗；return {success:false} 會被沙箱包成成功信封照樣往下走（c15011）。
      function isUnresolvedTemplate(v) {
        return typeof v === 'string' && /^\{\{[\w.]+\}\}$/.test(v);
      }
      const rawPageName = input.page_name;
      if (rawPageName == null || String(rawPageName).trim() === '' || isUnresolvedTemplate(rawPageName)) {
        throw new Error('page_name 缺失或未代入（收到 ' + JSON.stringify(rawPageName) + '）——拒絕寫入知識庫');
      }
      const pageName = String(rawPageName);
      // 🔴 c15345（總管實測抓到的真 bug）：呼叫端沒帶 path 時，同一個 `isUnresolvedTemplate`
      // 沒套在這一格——`input.path || (pageName + '.md')` 對字面 `{{input.path}}` 也是
      // truthy，跟 page_name 那次 c15014 撞過的病一模一樣，只是這次是 path 這格。
      // 修法：套同一個檢查，未代入就退回 `pageName + '.md'`，不讓字面模板字串流進
      // source_path／source_uri，寫進 KBDB 給使用者看到的原稿路徑。
      const rawPath = input.path;
      const path = (rawPath == null || String(rawPath).trim() === '' || isUnresolvedTemplate(rawPath))
        ? (pageName + '.md') : String(rawPath);
      const srcUri = 'kb://' + path;
      // `inkstone/InkStoneCo#140` comment 10651：常數格共用要在 parse_card 跑之前
      // 就把 library／machine 算好（同一份預設邏輯，逐字抄 parse_card 的
      // `String(input.library || 'kb')`／`String(input.machine || '')`——
      // 不能只用裸模板 `{{input.library}}`，因為 payload 沒帶該欄位時模板會
      // 原樣印出字面 `{{input.library}}`，不會像 JS `||` 那樣退回預設值）。
      const constLibrary = String(input.library || 'kb');
      const constMachine = String(input.machine || '');
      // inkstone/arcrun-rag#241：整張卡的內容指紋。所有會被寫進雲端 block 的東西（頁名、路徑、
      // 庫、機器、機器稱呼、卡片全文）都算進去——其中任何一格變了，指紋就變，才會重寫。
      // 純 JS 的 cyrb53 兩顆不同種子（共 106 位元）：只用來偵測「有沒有改過」，不是密碼學用途，
      // 且不依賴沙箱有沒有 crypto。
      function cyrb53(str, seed) {
        let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
        for (let i = 0; i < str.length; i++) {
          const ch = str.charCodeAt(i);
          h1 = Math.imul(h1 ^ ch, 2654435761);
          h2 = Math.imul(h2 ^ ch, 1597334677);
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
        return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
      }
      const hashSrc = JSON.stringify([pageName, path, constLibrary, constMachine,
        String(input.machine_label || ''), String(input.card_content == null ? '' : input.card_content)]);
      const cardHash = cyrb53(hashSrc, 0) + cyrb53(hashSrc, 7) + hashSrc.length.toString(16);
      return { success: true, src_uri: srcUri, src_uri_enc: encodeURIComponent(srcUri),
               const_library: constLibrary, const_machine: constMachine, card_hash: cardHash };
    input:
      page_name: "{{input.page_name}}"
      path: "{{input.path}}"
      library: "{{input.library}}"
      machine: "{{input.machine}}"
      machine_label: "{{input.machine_label}}"
      card_content: "{{input.card_content}}"
    limits:
      timeout_ms: 2000
      max_output_bytes: 65536

  list_old_blocks:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{input.page_name}}&owner_id=__NAMESPACE__&entry_type=block&limit=500"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  # 🔴 治本（`inkstone/Arcrun#223`／PR #225，2026-09-19）：原本這裡打
  # `/records/by-template/triplet?owner_id=…&limit=100`——撈的是**全租戶**三元組再
  # 靠 pick_stale 逐筆比對 source_uri 前綴，回應大小跟著租戶三元組總數長大，遲早撞
  # `http_request` 零件的 64 KiB 輸出上限（越線整顆 WASM trap，這個節點一失敗
  # `ON_SUCCESS` 就不往下走，整份卡從此寫不進知識庫而觸發端點照樣回 HTTP 200——
  # 分界線／算術見 `inkstone/arcrun-rag#104` 那次實測，同一個坑 `rag_takedown_direct`
  # 的 `list_triplets` 還沒補，保留在那份檔案裡供對照）。
  #
  # 新路：KBDB `GET /records/by-source/:template?field=&value=&owner_id=`
  # （`matrix/arcrun` PR #225，`recordIdsByFieldValue`：content 精確比對
  # `idx_entries_content` → `idx_entries_rel_dst` 反查關係列 → record id）直接查
  # 「這張卡自己的三元組」——field=source_uri、value=這張卡的 srcUri（`kb://path`，
  # 與下面 parse_card 算法一致，triplet 的 source_uri 永遠是完整值、不像 block 的
  # source 帶 `#N`，可精確比對）。成本只跟**這張卡自己的三元組數**成正比，與租戶
  # 三元組總數脫鉤；只回 record_ids（≈40 bytes/筆），遠低於 64 KiB。
  #
  # ⚠️ 已知取捨（誠實列出，未解）：`by-source` 只吃單一 field/value，不能再像舊版
  # pick_stale 那樣疊 machine 二次過濾（`inkstone/mira#6`：同一相對路徑被兩台不同
  # 機器監看時，用來避免互刪對方還活著的三元組——本來就是「兩邊都有值才收緊」的
  # 盡力而為，沒有 machine slot 時 KBDB 本來就會靜默丟掉這格）。block 那側（上面
  # list_old_blocks／下面 pick_stale 的 dead_entry）不受影響，machine 檢查原樣留著。
  list_old_triplets:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/records/by-source/triplet?field=source_uri&value={{prep.data.src_uri_enc}}&owner_id=__NAMESPACE__"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  # blocks 那側：逐筆核對來源再決定刪誰（防「同頁名不同卡」誤殺）——判準照抄
  # rag_takedown_direct 的 build_deprecations：meta.source_path === 本檔路徑，或
  # meta.source 以 kb://<路徑># 開頭；兩者皆無（老資料）＝fallback 本清單已按
  # page_name 查，視為命中。
  # triplets 那側：`list_old_triplets` 已在伺服器端用 source_uri 精確比對過，回來的
  # record_ids 直接就是「這張卡自己的舊三元組」，不需要再比對（見上方節點註解）。
  pick_stale:
    component: "__CODE_URL__"
    input:
      blocks_body: "{{list_old_blocks.data.body}}"
      triplets_body: "{{list_old_triplets.data.body}}"
      path: "{{input.path}}"
      machine: "{{input.machine}}"
      card_hash: "{{prep.data.card_hash}}"
    code: |
      function parse(b) { if (typeof b === 'string') { try { return JSON.parse(b); } catch (e) { return null; } } return b; }
      const path = String(input.path || '');
      const machine = String(input.machine || '');
      const kbPrefix = 'kb://' + path + '#';
      // 🔴 `inkstone/mira#6`（leo 2026-08-18）：path 是**相對於被監看資料夾**的路徑，
      //   所以兩台機器上的 `RFP/design.md` 在這裡長得一模一樣 ⇒ 後同步的那台會把
      //   前一台的知識**無聲刪掉**（症狀不是「變兩份」，是前面那份消失）。
      //   machine 是唯一分得開它們的那一維。規則照抄 arcrun-rag#46 對 library 的做法：
      //   **兩邊都有值時才收緊**——payload 沒帶（舊版 daemon）或卡上沒有（改版前的
      //   既有資料）都退回原本的行為，既有資料照樣被同一台機器 upsert 掉，不會突然變兩份。
      function machineBlocks(theirs) {
        return machine !== '' && theirs !== '' && theirs !== machine;
      }
      const ab = parse(input.blocks_body);
      const entries = (ab && ab.entries) || [];
      const dead_entry = [];
      const hitMetas = [];
      for (const e of entries) {
        let meta = {};
        if (e.metadata_json) { try { meta = JSON.parse(e.metadata_json) || {}; } catch (err) { meta = {}; } }
        const mPath = String(meta.source_path || '');
        const mSrc = String(meta.source || '');
        const hasPath = mPath !== '';
        const hasKbSrc = mSrc.indexOf('kb://') === 0;
        let hit;
        if (hasPath || hasKbSrc) {
          hit = (hasPath && path && mPath === path) || (hasKbSrc && path && mSrc.indexOf(kbPrefix) === 0);
        } else { hit = true; }
        if (hit && machineBlocks(String(meta.machine || ''))) hit = false;
        if (hit && e.id) { dead_entry.push({ id: e.id }); hitMetas.push(meta); }
      }
      // `inkstone/Arcrun#223`／PR #225：list_old_triplets 已改走 by-source（伺服器端用
      // source_uri 精確比對），回應只有 { record_ids: [...] }——不再是 by-template 那種
      // { records: [{record_id, values:{...}}] }，這裡不用再逐筆比對 source_uri/subject
      // （見 list_old_triplets 節點上方註解，含 machine 二次過濾拿掉的已知取捨）。
      const at = parse(input.triplets_body);
      const ids = (at && Array.isArray(at.record_ids)) ? at.record_ids : [];
      const dead_record = ids.map(function (id) { return { record_id: id }; });
      // inkstone/arcrun-rag#241：「跟雲端那份一模一樣」＝以下全部成立才算，缺一不可：
      //   ① 雲端這張卡有 block，且每一段都帶同一個 card_hash（＝跟這次送來的指紋相同）
      //   ② block 數量剛好等於寫入當時記下的段數 card_blocks，且各段來源（#N）不重複
      //      ⇒ 半寫入（少段）與重複寫入（多份）都不算「一樣」，會落到下面照舊刪光重寫＝順便清掉重複
      //   ③ 三元組數量剛好等於寫入當時記下的條數 card_rels
      // 舊資料沒有 card_hash ⇒ 一律算「有變」，重寫一次後就帶上指紋（一次性遷移）。
      const newHash = String(input.card_hash || '');
      let unchanged = false;
      if (newHash !== '' && hitMetas.length > 0) {
        const m0 = hitMetas[0];
        const nBlocks = Number(m0.card_blocks), nRels = Number(m0.card_rels);
        const seen = {};
        let allSame = true;
        for (const m of hitMetas) {
          if (String(m.card_hash || '') !== newHash) { allSame = false; break; }
          seen[String(m.source || '')] = true;
        }
        unchanged = allSame && nBlocks === hitMetas.length && Object.keys(seen).length === hitMetas.length
          && nRels === dead_record.length && dead_record.length > 0;
      }
      if (unchanged) {
        // 清單清空：上面兩條刪除用的 FOREACH 也跟著空轉，一列都不碰。
        return { result: true, unchanged: true, dead_entry: [], dead_record: [],
                 removed_blocks: 0, removed_triplets: 0, kept_blocks: hitMetas.length, kept_triplets: dead_record.length };
      }
      return { result: false, unchanged: false, dead_entry: dead_entry, dead_record: dead_record,
               removed_blocks: dead_entry.length, removed_triplets: dead_record.length };

  # inkstone/arcrun-rag#241：卡跟雲端那份一模一樣 ⇒ 到這裡收工，不寫任何東西。
  skip_unchanged:
    component: "__CODE_URL__"
    code: |
      return { success: true, skipped: true, reason: 'unchanged: 內容與雲端那份相同，未寫入' };
    limits:
      timeout_ms: 2000
      max_output_bytes: 4096

  delete_entry:
    component: "__HTTP_REQ_URL__"
    method: DELETE
    url: "__KBDB_BASE__/entries/{{dead_entry.id}}"
    headers:
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  delete_record:
    component: "__HTTP_REQ_URL__"
    method: DELETE
    url: "__KBDB_BASE__/records/{{dead_record.record_id}}"
    headers:
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  # 機械切塊（標題行為界）＋解析「## 關聯」三元組＋part_of 目錄邊（沿用 rag_ingest_direct parse_card；
  # 差別＝卡片內容直接吃 input.card_content）
  parse_card:
    component: "__CODE_URL__"
    code: |
      const md = String(input.card == null ? '' : input.card);
      const pageName = String(input.page_name || 'unknown');
      // 🔴 c15345：同一個 path 未代入退回預設值的檢查，跟 prep 節點那份逐字一致
      // （這裡是獨立沙箱、看不到 prep 算好的值，只能各自維護一份——同 library/machine
      // 兩格在這個節點裡的既有做法）。
      function isUnresolvedTemplateLocal(v) {
        return typeof v === 'string' && /^\{\{[\w.]+\}\}$/.test(v);
      }
      const rawPathLocal = input.path;
      const srcPath = (rawPathLocal == null || String(rawPathLocal).trim() === '' || isUnresolvedTemplateLocal(rawPathLocal))
        ? (pageName + '.md') : String(rawPathLocal);
      const srcUri = 'kb://' + srcPath;
      const lib = String(input.library || 'kb');
      // 🔴 `inkstone/mira#6`：machine 是**獨立的一格**，不塞進 source_uri。
      //   source_uri 的既有意思是「相對於被監看資料夾的路徑」，portal 的 srcLocalPath()
      //   直接把 `kb://` 之後整段當本機相對路徑用（console-ui/public/portal/index.html）——
      //   把機器名混進去會讓那條路吐出 `youlinhsieh@Leo-MBA/RFP/design.md` 這種不存在的路徑，
      //   而且舊資料的第一段（`kb://RFP/...` 的 RFP）會被誤讀成機器名 ⇒ **憑空長出假機器**。
      //   分成獨立欄位就沒有這個猜測：舊資料沒有這一格＝誠實地「未知來源」。
      const machine = String(input.machine || '');
      const machineLabel = String(input.machine_label || '') || machine;
      if (!md.trim()) return { success: false, error: 'card_content 為空' };
      const chunks = [];
      let cur = [];
      for (const line of md.split('\n')) {
        if (/^#{1,6}\s/.test(line) && cur.join('').trim()) { chunks.push(cur.join('\n').trim()); cur = []; }
        cur.push(line);
      }
      if (cur.join('').trim()) chunks.push(cur.join('\n').trim());
      const blocks = chunks.map(function (content, i) {
        return { content: content, page_name: pageName, source: srcUri + '#' + i, source_path: srcPath,
                 library: lib, machine: machine, machine_label: machineLabel };
      });
      const rels = [];
      // InkStoneCo#44：#6-#10 改版後,「## 關聯」下面多了「### 內文知識關係」
      // 「### 卡片關係」「### 出處」三個 H3 子區。舊版界線 (?=\n#|\n---|$) 把任何
      // 井字號開頭的行都當成段落結束——遇到緊接在「## 關聯」後的第一個「### ...」
      // 子標題就立刻收尾,relSec[1] 只抓到「### 內文知識關係」這一行本身,真正的
      // 關係清單（卡片關係／出處那些「主體>>述語>>客體」行）從未被讀到,parse_card
      // 只剩最後機械補的 part_of 一條會進 kbdb（實測：4 條卡上宣稱的關係只落地 1 條）。
      // 修法：邊界只認「下一個 H1／H2」（1-2 個 # 後面接空白,且不是第 3 個 #),
      // 不再被巢狀的 H3 子標題提前打斷；沒有下一個 H1/H2 時仍讀到檔尾或 ---。
      const relSec = /##\s*關聯\s*\n([\s\S]*?)(?=\n#{1,2}(?!#)\s|\n---|$)/.exec(md);
      if (relSec) {
        for (const line of relSec[1].split('\n')) {
          const m = /^\s*(?:[-*]\s*)?(.+?)\s*>>\s*(.+?)\s*>>\s*(.+?)\s*$/.exec(line);
          if (!m) continue;
          rels.push({ subject: m[1], predicate: m[2], object: m[3], source_uri: srcUri, status: 'active', library: lib, machine: machine });
        }
      }
      rels.push({ subject: pageName, predicate: 'part_of', object: 'knowledge-base', source_uri: srcUri, status: 'active', library: lib, machine: machine });
      // inkstone/arcrun-rag#241：每段 block 記下整張卡的指紋與「寫入當時共幾段、幾條三元組」，
      // 下次收同一張卡時 pick_stale 靠這三格判斷「雲端那份是不是完整且一模一樣」。
      const cardHash = String(input.card_hash || '');
      for (const b of blocks) { b.card_hash = cardHash; b.card_blocks = String(blocks.length); b.card_rels = String(rels.length); }
      return { success: true, blocks: blocks, block_count: blocks.length, rels: rels, rel_count: rels.length, page_name: pageName };
    input:
      card_hash: "{{prep.data.card_hash}}"
      card: "{{input.card_content}}"
      page_name: "{{input.page_name}}"
      path: "{{input.path}}"
      library: "{{input.library}}"
      machine: "{{input.machine}}"
      machine_label: "{{input.machine_label}}"
    limits:
      timeout_ms: 5000
      max_output_bytes: 4194304

  # 寫 KBDB blocks（與 rag_ingest_direct post_block 逐欄一致）
  post_block:
    component: "__HTTP_REQ_URL__"
    method: POST
    url: "__KBDB_BASE__/entries"
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"
    body_json:
      entry_type: "block"
      content: "{{block.content}}"
      owner_id: "__NAMESPACE__"
      page_name: "{{block.page_name}}"
      # machine／machine_label（`inkstone/mira#6`）與 source／source_path／library 並排：
      # 這四格合起來就是「這則知識的原稿在哪」——哪台機器、哪個庫、哪個相對路徑、第幾段。
      # 空字串＝舊版 daemon 沒送 ⇒ portal 顯示「未知來源」，**不猜、不填假名**。
      metadata_json: "{\"source\":\"{{block.source}}\",\"source_path\":\"{{block.source_path}}\",\"library\":\"{{block.library}}\",\"machine\":\"{{block.machine}}\",\"machine_label\":\"{{block.machine_label}}\",\"card_hash\":\"{{block.card_hash}}\",\"card_blocks\":\"{{block.card_blocks}}\",\"card_rels\":\"{{block.card_rels}}\"}"

  # ── 常數格共用（`inkstone/InkStoneCo#140` comment 10651，2026-09-21）────────────
  # 同一張卡的每一條三元組，source_uri/status/library/machine 四格內容永遠相同
  # （同一份文件、同一次上傳）。改法：這四格各建**一次** value entry，
  # post_triplet 用 KBDB `createRecord` 既有支援的 `entry_ids` 指標機制共用同一顆，
  # 不再讓每一條三元組各自新建這四格 entry（各自的索引＋FTS 觸發器也就不再各自重建一次）。
  # 不動 KBDB schema／API：`POST /records` 的 `entry_ids` 是既有機制（record-crud.ts）。
  # 實測（Miniflare，23 條三元組一批）：130.5 → 102.5 列/條，再省 21.5%。
  post_const_source_uri:
    component: "__HTTP_REQ_URL__"
    method: POST
    url: "__KBDB_BASE__/entries"
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"
    body_json:
      entry_type: "value"
      content: "{{prep.data.src_uri}}"
      owner_id: "__NAMESPACE__"

  post_const_status:
    component: "__HTTP_REQ_URL__"
    method: POST
    url: "__KBDB_BASE__/entries"
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"
    body_json:
      entry_type: "value"
      # status 對三元組永遠是字面常數 'active'（與 parse_card 的 rel.status 一致），
      # 不必等任何節點算，直接寫死。
      content: "active"
      owner_id: "__NAMESPACE__"

  post_const_library:
    component: "__HTTP_REQ_URL__"
    method: POST
    url: "__KBDB_BASE__/entries"
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"
    body_json:
      entry_type: "value"
      content: "{{prep.data.const_library}}"
      owner_id: "__NAMESPACE__"

  post_const_machine:
    component: "__HTTP_REQ_URL__"
    method: POST
    url: "__KBDB_BASE__/entries"
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"
    body_json:
      entry_type: "value"
      content: "{{prep.data.const_machine}}"
      owner_id: "__NAMESPACE__"

  # 四支 POST /entries 回應的 body 是字串（http_request 零件契約：data.body 恆為字串，
  # 不是零件自動解析的物件），這裡統一 JSON.parse 抽出 entry.id，收斂成一個物件給
  # post_triplet 的 entry_ids 用。任何一格抽不到 id → success:false，整份卡在這裡停下
  # （不靜默放行去生半殘的三元組——四格常數建不出來，後面每一條三元組都會缺這一角）。
  pool_constants:
    component: "__CODE_URL__"
    input:
      source_uri_body: "{{post_const_source_uri.data.body}}"
      status_body: "{{post_const_status.data.body}}"
      library_body: "{{post_const_library.data.body}}"
      machine_body: "{{post_const_machine.data.body}}"
    code: |
      function parseEntryId(raw) {
        let obj;
        try { obj = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return null; }
        return (obj && obj.entry && obj.entry.id) ? obj.entry.id : null;
      }
      const source_uri_id = parseEntryId(input.source_uri_body);
      const status_id = parseEntryId(input.status_body);
      const library_id = parseEntryId(input.library_body);
      const machine_id = parseEntryId(input.machine_body);
      if (!source_uri_id || !status_id || !library_id || !machine_id) {
        return { success: false, error: '常數格 entry 建立失敗：' + JSON.stringify({ source_uri_id: source_uri_id, status_id: status_id, library_id: library_id, machine_id: machine_id }) };
      }
      return { success: true, source_uri_id: source_uri_id, status_id: status_id, library_id: library_id, machine_id: machine_id };
    limits:
      timeout_ms: 2000
      max_output_bytes: 65536

  # 寫 KBDB triplets（與 rag_ingest_direct post_triplet 血統一致；差別＝常數格改走 entry_ids 指標）
  post_triplet:
    component: "__HTTP_REQ_URL__"
    method: POST
    url: "__KBDB_BASE__/records"
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"
    body_json:
      template: "triplet"
      owner_id: "__NAMESPACE__"
      values:
        # subject/predicate/object 逐條三元組不同，仍照舊路新建各自的 value entry。
        subject: "{{rel.subject}}"
        predicate: "{{rel.predicate}}"
        object: "{{rel.object}}"
      entry_ids:
        # source_uri/status/library/machine 這一張卡內是常數，指向 pool_constants
        # 收斂出的既有 entry（同一顆，本卡所有三元組共用），不再各自新建。
        source_uri: "{{pool_constants.data.source_uri_id}}"
        status: "{{pool_constants.data.status_id}}"
        library: "{{pool_constants.data.library_id}}"
        # machine（`inkstone/mira#6`）：template 沒有這個 slot 的實例，走 entry_ids
        # 會直接報錯（record-crud.ts createRecord 對 entry_ids 是 unknown slot 即拋錯，
        # 不像 values 路徑靜默丟掉）——但 machine 已是 PORTAL_TEMPLATE_SEEDS 的既有欄位，
        # ensurePortalTemplates 對既有實例會 PATCH 補上，不需要本檔額外處理。
        machine: "{{pool_constants.data.machine_id}}"

  # ── inkstone/arcrun-rag#13 c14501 B①：wiki 卡片寫入即自動分群 ──────────────────
  # parse_card 成功後的第三條出邊（跟上面兩條 FOREACH 平行，互不牽連）。
  # 只做整形，不碰 KBDB——實際讀/決策/寫都在 rag_cluster_auto 那支既有的 workflow裡，
  # 這裡只是內部呼叫它，同一支分群邏輯不重造第二份（見 workflows/cluster/ 那條 SDD）。
  # c14949（承接 c14946「還沒通的」第 3 條）：呼叫端沒帶 page_name 時，模板引擎不會
  # 回傳 undefined／'unknown'，而是把 `{{input.page_name}}` 這串字面文字原封不動塞進來
  # （decide.js 的 opt() helper 抓到的同一個真限制，見 rag_cluster_auto_decide_node.js
  # 檔頭註解）——`parse_card` 自己的 `input.page_name || 'unknown'` 判斷對這種情況一律
  # 誤判成「有傳」，於是這裡原本直接照抄 `'kb://' + pageName`，把字面上的
  # `kb://{{input.page_name}}` 當成真的 item_id 送進分群（stage 上已撞到一筆真實資料，
  # 見 inkstone/arcrun-rag#13 comment 14946）。修法：拒收看起來像沒被代入的樣板字串，
  # 不把它送進分群——這不影響卡片本身寫進 KBDB（那條路徑在 parse_card 已經完成，
  # 這裡只是 parse_card 之後獨立的第三條出邊，見上面的說明）。
  # 🔴 c15011（總管 stage 實跑抓到的真限制，跟 prod-write-guard 那類「以為 return
  # {success:false} 就會被 ON_FAIL 接住」是同一種誤解，這次撞在 `code` 零件上）：
  # `code` 零件的沙箱（registry/components/code/sandbox.mjs runCode）**永遠**把
  # user code 正常 return 的值包成 `{success:true, data:<那個值>}`——不管那個值
  # 裡面自己塞了什麼 `success` 欄位，都只是 `data` 底下的普通資料，不會被讀出來
  # 影響外層信封的 success。graph-executor 的 `isFailure()` 只看外層（頂層）的
  # `success`／`error`，所以上一輪寫的 `return {success:false, error:...}`
  # **外層仍然是 success:true**，走的是 ON_SUCCESS，`trigger_wiki_cluster` 照樣
  # 被呼叫、`ON_FAIL` 邊從沒被觸發——這正是總管在 stage 撞到「B 不帶 page_name
  # 卻寫進 item_id "#"」的真因。
  # 唯一能讓外層信封真的變成 `{success:false,...}` 的方法是 **throw**——
  # sandbox.mjs 的 `evalCode` 抓到 user code 丟出的例外時，才會回
  # `{success:false, error, error_type:'UserCodeError'}`（見該檔 `err()`），
  # 這才是 `isFailure()` 認得、會真的觸發 ON_FAIL 路由的形狀。
  prep_cluster_wiki:
    component: "__CODE_URL__"
    input:
      page_name: "{{parse_card.data.page_name}}"
      blocks: "{{parse_card.data.blocks}}"
      # inkstone/arcrun-rag#13 c15294/c15323 第 1/2/3 點（leo 09-28 裁決＋總管 c15323
      # 退回要求跟上）：分群/hub/目錄要以「子庫」為邊界——library 早在 `prep` 節點
      # 就用同一份預設邏輯算好（`String(input.library || 'kb')`），這裡直接沿用，
      # 不再另一套猜法。
      library: "{{prep.data.const_library}}"
    code: |
      function looksUnsubstituted(v) {
        return typeof v === 'string' && /^\{\{[\s\S]*\}\}$/.test(v.trim());
      }
      var rawPageName = input.page_name;
      if (rawPageName === undefined || rawPageName === null || rawPageName === '' ||
          looksUnsubstituted(rawPageName) || String(rawPageName) === 'unknown') {
        throw new Error('page_name 未代入或缺失（收到：' + JSON.stringify(rawPageName) + '），拒收未代入的樣板字串，不觸發分群');
      }
      var pageName = String(rawPageName);
      var blocks = Array.isArray(input.blocks) ? input.blocks : [];
      // c15345（總管實測：00-INDEX 讀回的摘要是「# 頁名」標題行，不是真摘要）：blocks[0]
      // 通常只是 H1 標題那個 chunk（parse_card 以標題切塊，「## 摘要」另成一塊）。
      // 改成跟 kbdb library-index.ts 的 GLOSS_HEADINGS 同一套慣例去找摘要段
      // （兩套段名都收：雲端重萃「## 摘要」／本機 daemon「## 一句話定義」），
      // 找不到才退回 blocks[0]（沒有摘要段的卡至少還有個開頭可看）。
      var GLOSS_HEADINGS_LOCAL = ['## 摘要', '## 一句話定義'];
      var glossBlock = null;
      for (var bi = 0; bi < blocks.length; bi++) {
        var bc = String(blocks[bi].content || '');
        for (var hi = 0; hi < GLOSS_HEADINGS_LOCAL.length; hi++) {
          if (bc.indexOf(GLOSS_HEADINGS_LOCAL[hi]) === 0) { glossBlock = bc; break; }
        }
        if (glossBlock) break;
      }
      var snippetSource = glossBlock !== null ? glossBlock : (blocks.length ? String(blocks[0].content || '') : '');
      var snippet = snippetSource
        .split('\n')
        .filter(function (l) { return GLOSS_HEADINGS_LOCAL.indexOf(l.trim()) === -1; })
        .join(' ')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 300);
      // library 理論上 `prep` 一定會給值（沒帶就退回 'kb'），這裡再防禦一次未代入的
      // 樣板字面字串，跟 page_name 同一套檢查邏輯。
      var rawLibrary = input.library;
      var library = (rawLibrary === undefined || rawLibrary === null || rawLibrary === '' || looksUnsubstituted(rawLibrary))
        ? 'kb' : String(rawLibrary);
      // c15323 第 3 點（總管退回「一列一卡＋摘要」只有 title 沒摘要）：
      // item_title 保持「pageName+片段」不變（分群 TF-IDF 沿用這個組合文字，避免
      // 動到既有分群精度）；item_summary 是給卡層級目錄列顯示用的純片段，不進分群。
      return { success: true, item_id: 'kb://' + pageName,
               item_title: (pageName + ' ' + snippet).trim(),
               item_summary: snippet || pageName,
               item_library: library };
    limits:
      timeout_ms: 2000
      max_output_bytes: 65536

  trigger_wiki_cluster:
    component: "__HTTP_REQ_URL__"
    method: POST
    url: "__CYPHER_BASE__/webhooks/named/rag_cluster_auto/query"
    headers:
      Content-Type: "application/json"
      X-Arcrun-API-Key: "__NAMESPACE__"
    body_json:
      action: "opened"
      use_type: "wiki"
      item_id: "{{prep_cluster_wiki.data.item_id}}"
      item_title: "{{prep_cluster_wiki.data.item_title}}"
      item_summary: "{{prep_cluster_wiki.data.item_summary}}"
      item_labels: []
      library: "{{prep_cluster_wiki.data.item_library}}"

  # inkstone/arcrun-rag#13 c14569：純吸收節點，接住 trigger_wiki_cluster 的 ON_FAIL 邊。
  # 一般使用者的實例沒裝 rag_cluster_auto 時，trigger_wiki_cluster 打 404、
  # http_request 零件回 {success:false}——這裡固定回 success:true，讓「分群沒發生」
  # 停在這一支分支自己身上，不會讓整個 rag_ingest_card 的外層 success 變 false
  # （inkstone/Arcrun#254 的 deriveExecutionVerdict：節點失敗只要有 ON_FAIL 邊接住
  # 就不算未處理）。有裝 rag_cluster_auto 的實例（如 youlin stage）trigger_wiki_cluster
  # 直接成功，不會走到這裡。
  wiki_cluster_absorb_fail:
    component: "__CODE_URL__"
    code: |
      return { success: true, wiki_cluster_skipped: true, reason: 'rag_cluster_auto not installed or unreachable on this instance' };
    limits:
      timeout_ms: 2000
      max_output_bytes: 4096

  # c14949：純吸收節點，接住 prep_cluster_wiki 的 ON_FAIL 邊（呼叫端沒帶／帶了未代入
  # 樣板字串的 page_name）。同 wiki_cluster_absorb_fail 的精神——分群這條分支失敗
  # 不該波及外層 success、也不該影響卡片本身寫進 KBDB（那條路徑早在 parse_card
  # 就已完成）；分開一個節點只是為了 reason 文字誠實對應真正發生的事。
  wiki_cluster_absorb_prep_fail:
    component: "__CODE_URL__"
    # 🔴 c15011：prep_cluster_wiki 現在用 throw 失敗（見該節點註解），沙箱對
    # 「user code 丟例外」的封裝是 `{success:false, error, error_type}`——
    # **沒有** `.data` 包一層（`.data` 只在 user code 正常 return 時才有，見
    # sandbox.mjs 的 `{success:true, data:<回傳值>}` vs `err()` 的
    # `{success:false, error, error_type}` 兩種形狀）。原本綁
    # `{{prep_cluster_wiki.data.error}}` 對著一個不存在的路徑，只會拿到
    # undefined／沒代入的字面字串——改綁 `{{prep_cluster_wiki.error}}`（頂層）。
    input:
      prep_error: "{{prep_cluster_wiki.error}}"
    code: |
      return { success: true, wiki_cluster_skipped: true, reason: String(input.prep_error || 'page_name invalid, cluster trigger skipped') };
    limits:
      timeout_ms: 2000
      max_output_bytes: 4096

  # ── inkstone/Arcrun#60：parse_card 之後獨立的第四條出邊 ──────────────────────
  # 🔴 實測抓到、追出根因的真限制（記在這裡，供下一個接手的人參考，問題不在
  # arcrun-rag，在 Arcrun 核心 `cypher-executor/src/graph-executor.ts` 的
  # `executeNode` 處理某節點多條出邊的迴圈：`for (const edge of outEdges) { ...
  # case 'ON_SUCCESS': result = await this.executeNode(nextNode, ...) }`——
  # 迴圈裡的 `result` 是共用變數，處理**第一條** ON_SUCCESS 邊時就把 `result`
  # 整個換成那條邊底下子節點（可能是好幾層之後）的輸出；等迴圈輪到**第二條**
  # ON_SUCCESS 邊（本節點），`propagateCtx(context, result, node.id)` 傳進去的
  # `result` 早已不是 `parse_card` 自己的輸出，而是第一條分支（`prep_cluster_wiki`
  # 那條）用剩的——於是 `ctx.parse_card` 被寫成錯的值，任何具名參照
  # `{{parse_card.data.X}}` 在「parse_card 的第二條以後的 ON_SUCCESS 分支」裡
  # 一律讀不到（不管 X 是 `rels`、`entities_json` 或任何欄位，親測都一樣）。
  # 這是 Arcrun 核心的 bug，不是 arcrun-rag 該修的（CLAUDE.md「非改核心不可→
  # 回報總管開 issue」），繞開法：本節點完全不碰 `parse_card.*`，改用
  # `{{input.card_content}}`／`{{input.page_name}}`（原始 workflow input，
  # 走 `context`／`baseCtx` 不走會被污染的 `result`，全程可靠——`trigger_wiki_cluster`
  # 的 `card_content` 引用能一直正常也是靠這條路）自己重解析一次「## 關聯」，
  # 邏輯與 `parse_card` 逐字一致（同一份規則，只是各自維護一份，同檔內
  # `library`／`machine` 兩格在 `parse_card` 自己也是這樣做，見該節點註解）。
  # 已回報：inkstone/Arcrun#276。
  prep_entity_concept:
    component: "__CODE_URL__"
    input:
      card: "{{input.card_content}}"
      page_name: "{{input.page_name}}"
      library: "{{prep.data.const_library}}"
    code: |
      function looksUnsubstitutedLocal(v) {
        return typeof v === 'string' && /^\{\{[\s\S]*\}\}$/.test(v.trim());
      }
      var md = String(input.card == null ? '' : input.card);
      var relSec = /##\s*關聯\s*\n([\s\S]*?)(?=\n#{1,2}(?!#)\s|\n---|$)/.exec(md);
      var seen = {};
      var entities = [];
      if (relSec) {
        var lines = relSec[1].split('\n');
        for (var i = 0; i < lines.length; i++) {
          var m = /^\s*(?:[-*]\s*)?(.+?)\s*>>\s*(.+?)\s*>>\s*(.+?)\s*$/.exec(lines[i]);
          if (!m) continue;
          var pair = [String(m[1] || '').trim(), String(m[3] || '').trim()];
          for (var k = 0; k < pair.length; k++) {
            var e = pair[k];
            if (!e || e === 'knowledge-base' || seen[e]) continue;
            seen[e] = true;
            entities.push(e);
          }
        }
      }
      if (entities.length === 0) {
        throw new Error('本卡「## 關聯」段沒有可處理的 entity（沒有這段，或裡面沒有 A>>B>>C 格式的行）');
      }
      var rawLibrary = input.library;
      var library = (rawLibrary === undefined || rawLibrary === null || rawLibrary === '' || looksUnsubstitutedLocal(rawLibrary))
        ? 'kb' : String(rawLibrary);
      return { success: true, entities_json: JSON.stringify(entities), library: library };
    limits:
      timeout_ms: 2000
      max_output_bytes: 65536

  trigger_entity_concept:
    component: "__HTTP_REQ_URL__"
    method: POST
    url: "__CYPHER_BASE__/webhooks/named/rag_entity_concept/query"
    headers:
      Content-Type: "application/json"
      X-Arcrun-API-Key: "__NAMESPACE__"
    body_json:
      entities_json: "{{prep_entity_concept.data.entities_json}}"
      library: "{{prep_entity_concept.data.library}}"
      card_content: "{{input.card_content}}"

  # 純吸收節點，接住 trigger_entity_concept 的 ON_FAIL 邊。一般使用者的實例沒裝
  # rag_entity_concept 時打 404，http_request 零件回 {success:false}——這裡固定回
  # success:true，讓「這條分支沒發生」停在自己身上，不波及外層 rag_ingest_card 的
  # success（同 wiki_cluster_absorb_fail 的精神）。有裝的實例（如 youlin stage）
  # trigger_entity_concept 直接成功，不會走到這裡。
  entity_concept_absorb_fail:
    component: "__CODE_URL__"
    code: |
      return { success: true, entity_concept_skipped: true, reason: 'rag_entity_concept not installed or unreachable on this instance' };
    limits:
      timeout_ms: 2000
      max_output_bytes: 4096

  # 純吸收節點，接住 prep_entity_concept 的 ON_FAIL 邊（這張卡沒有可處理的 entity）。
  # 同 wiki_cluster_absorb_prep_fail 的精神——prep_entity_concept 用 throw 失敗，
  # 沙箱封裝成 {success:false, error}（沒有 .data 那層），綁 `.error`（頂層）。
  entity_concept_absorb_prep_fail:
    component: "__CODE_URL__"
    input:
      prep_error: "{{prep_entity_concept.error}}"
    code: |
      return { success: true, entity_concept_skipped: true, reason: String(input.prep_error || 'no entities extracted, entity/concept trigger skipped') };
    limits:
      timeout_ms: 2000
      max_output_bytes: 4096
