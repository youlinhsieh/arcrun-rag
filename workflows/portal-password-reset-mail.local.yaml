# portal_password_reset_mail — 「忘記密碼」寄信（inkstone/arcrun-rag#75）
#
# 為什麼是工作流：以前 cypher 的 /portal/password/forgot 用手寫 JS（relayResetLink）直接打郵差，
# 工作流頁看不到、沒有執行紀錄、無法稽核（leo 2026-08-11：「這是 Leo21c 的工作流，沒有寄信的」）。
# 現在「門口那顆忘記密碼」＝公開觸發點 → 觸發這條工作流 → 由它的 http_request 打郵差。
#
# 郵差（arcrun.dev landing 的 /api/send-password-reset）保留：leo c1948「arcrun.dev 那半就是 API」。
# 🔴 絕不把完整 URL 交給郵差（防釣魚中繼）：這裡只給 {email, api_origin, ticket}，連結由郵差回頭
#    打 api_origin 的 /portal/password/relay-verify 向實例自己要，見 landing/worker.js 的 D62 段。
#
# 觸發（實例內部呼叫，不是給人手動打的）：
#   input = {email, api_origin, ticket, relay_base}
#   relay_base＝這台實例的 PORTAL_MAIL_RELAY_BASE（stage 指向 staging 郵差，prod 指向 arcrun.dev），
#   由 cypher 帶進來，所以這份定義沒有任何要代換的網址。
# 舊實例沒裝到這條時，cypher 退回舊的 relayResetLink 並記 deprecated log（相容期）。

name: portal_password_reset_mail
description: >
  忘記密碼寄信：實例按下「忘記密碼」後觸發，用 http_request 請郵差（arcrun.dev）寄出修改密碼連結。
  工作流頁看得到、每次寄信都有執行紀錄。（inkstone/arcrun-rag#75）

flow:
  - "input >> ON_SUCCESS >> send_reset_mail"

config:
  send_reset_mail:
    component: "__HTTP_REQ_URL__"
    method: POST
    url: "{{input.relay_base}}/api/send-password-reset"
    headers:
      Content-Type: "application/json"
    body_json:
      email: "{{input.email}}"
      api_origin: "{{input.api_origin}}"
      ticket: "{{input.ticket}}"
