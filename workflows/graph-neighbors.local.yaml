# graph_neighbors — 知識圖譜 1..N 跳鄰居查詢（arcrun-rag 包件）
#
# 血統：arcrun-rag repo workflows/graph-neighbors.yaml（T5-graph，canonical 版）的
#   安裝參數化版。canonical 版用零件名（component: http_request/code）——上游 G1 缺口
#   （wasmWorkerUrl 寫死 workers.dev）使零件名在本機/地端跑不通，故包版把零件引用
#   參數化成 URL 佔位，installer 代入本機零件 worker。
#
# 觸發（同步查詢）：
#   GET {cypher}/q/__NAMESPACE__/graph_neighbors?node=<節點>&depth=2&template=triplet&namespace=__NAMESPACE__&kbdb_base=__KBDB_BASE__

name: graph_neighbors
description: >
  同步查詢：向 KBDB 的 /graph/neighbors/:node 端點要「這個節點的鄰居」，同步回鄰居清單。
  arcrun-rag 產品包版（零件走安裝時代入的 worker URL）。

# ══════════════════════════════════════════════════════════════════════════════
# 🔴 inkstone/Arcrun#168（2026-08-27）——為什麼把「撈全表 → 記憶體 BFS」整段拿掉
#
# 舊做法：fetch_triplets 打 GET /records/by-template/triplet?...&limit=100，把整批三元組
# 塞進 code 節點做 BFS。**那條路只看得到「這個租戶最新的 N 筆」**（`ORDER BY created_at
# DESC LIMIT N`）⇒ 三元組越寫越多，越舊的實體越先被擠出視窗，跟它的內容對不對、
# 標記對不對完全無關。
#
# 實測（youlin `yuga3bse`，2026-08-27，不是推論）：
#   總筆數 226；`[[小果被AFTEE詐貸]]`（2026-07-28 收的）的三條三元組排名 99／100／101，
#   剛好卡在 limit=100 的門檻上 ⇒ 同一分鐘內，今天寫的節點查得到 4 個鄰居、
#   7 月底寫的查到 0 個。leo 的知識庫「越舊的東西越查不到」，病根就在這裡。
#
# 🔴 **調大 limit 不是解，已被真資料證偽兩次**：226 筆打包成這支零件要吃的形狀是
#   **68,387 bytes**，已超過 `http_request` 零件輸出緩衝區 65,536 的 cap
#   （超過就 trap 成 `unreachable`，見 `inkstone/arcrun-rag#104`）⇒ 調到 500 只會讓
#   這支查詢自己壞掉，從「查不到舊資料」變成「整條查詢壞掉」。
#
# 修法：KBDB 新增 `GET /graph/neighbors/:node`（`kbdb/src/actions/graph-query.ts`，
# `inkstone/Arcrun#172` 已併入 matrix/arcrun main）——**反過來從節點名直接查**，
# 逐跳只查上一跳新發現的節點（走 `idx_entries_content` ＋既有 `idx_entries_rel_dst`）。
# ⇒ 回應大小只跟**實際鄰居數量**成正比，不跟租戶三元組總數或資料新舊有關係。
# ⇒ 這支 workflow 因此不再需要 `limit`，也不再需要在記憶體裡建鄰接表；
#   `deprecated` 三元組的過濾也一併搬進 KBDB 端（`graph-query.ts`），不再靠這裡的 code 節點。
#
# ⚠️ **誠實記一筆行為變化**：舊的記憶體 BFS 比對節點名時做過 NFKC＋小寫正規化
#   （「搜 rag 命中節點 RAG」）。新端點是 `entries.content` **精確比對** ⇒ 那個寬鬆比對沒了。
#   本票的回歸案例（`[[小果被AFTEE詐貸]]`，完整標題）不受影響；
#   「打一個關鍵字要命中含它的長標題」本來就不是這條路在解的事，那是 `inkstone/Arcrun#130`
#   （三元組存字串不是 ID、alias 沒有掛勾點）要解的那格——不要在這裡偷偷補一個 LIKE 蓋過去。
#
# ⚠️ 這一版要求實例的 kbdb 至少是資料層第 8 代（`GET {kbdb}/health` 的
#   `data_layer.actual_generation`）。第 7 代以下沒有這支端點與 `idx_entries_content`
#   索引，會回 404 ⇒ 安裝器同時換 kbdb 與 workflow，兩者不要分開更新。
# ══════════════════════════════════════════════════════════════════════════════

flow:
  - "input >> ON_SUCCESS >> prep"
  - "prep >> ON_SUCCESS >> fetch_neighbors"
  - "fetch_neighbors >> ON_SUCCESS >> parse_neighbors"

config:
  # 節點名進 URL **路徑**之前先 encodeURIComponent——與 rag_takedown_direct 的 prep
  # 同一條既有慣例（`agent-memory §7` 實撞教訓），不另立第二種做法。
  #
  # 🔴 這一步不是裝飾：卡片標題會出現 `#`、`?`、`%`、空白。`#` 沒編碼就是 URL 片段起點
  #   ⇒ 後半整段（含 query string）被截掉 ⇒ 症狀是「查不到」，而這正是本票要修的那個病。
  #   `[[…]]` 的中括號與 CJK 交給 URL 解析器也會過，但那是「剛好沒事」，不是保證。
  prep:
    component: "__CODE_URL__"
    code: |
      const node = String(input.node == null ? '' : input.node).trim();
      if (!node) return { success: false, error: 'graph_neighbors 缺 node 參數' };
      const d = parseInt(String(input.depth == null ? 1 : input.depth), 10);
      const depth = Math.max(1, Math.min(Number.isFinite(d) && d > 0 ? d : 1, 10));
      const template = String(input.template == null ? '' : input.template).trim() || 'triplet';
      const directed = String(input.directed) === 'true' ? 'true' : 'false';
      return { success: true, node: node, node_enc: encodeURIComponent(node),
               depth: String(depth), template: encodeURIComponent(template), directed: directed };
    input:
      node: "{{input.node}}"
      depth: "{{input.depth}}"
      template: "{{input.template}}"
      directed: "{{input.directed}}"
    limits:
      timeout_ms: 2000
      max_output_bytes: 65536

  fetch_neighbors:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/graph/neighbors/{{prep.data.node_enc}}?depth={{prep.data.depth}}&template={{prep.data.template}}&directed={{prep.data.directed}}&owner_id=__NAMESPACE__"
    headers:
      Accept: "application/json"
      # 🔴 t195（2026-08-05）：與收卡端同一個病——D36（07-29）把全體改走 credential，
      #   但那筆修補只落在 fix/cis-round3-install，main／feat/daemon 都沒合併
      #   ⇒ 這支圖譜查詢在 main 上一直沒帶授權。kbdb 的牆是 worker 層級，GET 一樣要帶。
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  # 把 fetch_neighbors 的字串 body 解析成結構化 JSON——純局部整形，不是業務邏輯。
  # BFS 本身已經全部在 KBDB 端做完。
  parse_neighbors:
    component: "__CODE_URL__"
    code: |
      let body = input.body;
      if (body && typeof body === 'object') return body;
      try {
        return JSON.parse(String(body));
      } catch (e) {
        return { success: false, error: 'graph_neighbors: KBDB 回應不是合法 JSON：' + String(e) };
      }
    input:
      body: "{{fetch_neighbors.data.body}}"
    limits:
      timeout_ms: 1000
      max_output_bytes: 2097152
