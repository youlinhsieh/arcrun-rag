# feedback_report — 學員／封測者打字回報，一律變成 inkstone/arcrun-rag 的一張票
# （inkstone/arcrun-rag#210）
#
# leo 2026-09-20 原話：「現在封測不只朋友，還有學員，他們發現問題如何回報我？
# 他們不會用 github issues⋯⋯不然多少人測試也不知道有什麼需要改的。」
# 定案經過（同票 comment 10300 → 10309，四次修正，最後一次拍板）：
#   ① 一開始想只發 Telegram → leo 否決：「只有我知道，這個回饋應該要你可以看到」
#   ② 改想存 KBDB feedback template → leo 再否決：「還是說用戶來的應該變成票？
#      因為你本來就有有票就通知你的機制，所以它會通知你，就進行分診」
#   ⇒ 定案：一則回報＝一張票（label user + s/triage），自動接上既有的分診產線
#     （`inkstone/ISEP#159`），不必為回報另造一個收件匣。
#
# 🔴 紅線（票上寫的，這裡逐條對應）：
#   · 學員沒有 Gitea 帳號 ⇒ 票由機器帳號代開，內文要寫清楚回報者是誰
#     （顯示名／email／實例），不能看起來像機器自己開的。
#   · 外部輸入一律 user + s/triage 進場，不准直接標 s/todo——分診由既有機制做。
#   · 標題＝學員原話（不 AI 改寫），只做「多空白壓成一個空格＋超長截斷」這種機械處理。
#   · ①開票失敗＝送出失敗（學員要看到「沒送出去，請再試一次」）；
#     ②Telegram 通知可以失敗，不影響①已經開成的事實。
#   · 金鑰只寫 {{credential.gitea_token}}（D36），值在執行前才由金鑰中心回填。
#
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 2026-09-21 改版：**這條工作流不再依賴任何私庫 recipe。** 推它只要一個動作。
# ══════════════════════════════════════════════════════════════════════════════
#
# 舊版用 `component: gitea_create_issue` / `component: notify_leo_relay` 引用兩份
# 要先 `arcrun_recipe_push` 到私庫的 recipe ⇒ **上線是兩個動作，而推 recipe 那個
# 動作在雲端 session 裡推不上去**（comment 10532／10540：MCP 的 `arcrun_recipe_push`
# schema 沒有 `body_template` 欄位且 additionalProperties:false，走它等於重現
# `df9b402d` 修掉的 100% 靜默失敗；走 HTTP 則被 harness 的 classifier 擋死）。
#
# 改法＝兩個節點都換成引擎自帶的 `http_request` 零件，把 recipe 的 endpoint／
# method／headers／body 直接寫在節點上。**為什麼這樣是安全的，三條都實讀過引擎**：
#
#   ① `http_request` 不需要任何 recipe 就解析得動。
#      `cypher-executor/src/lib/component-loader.ts:37` 的 `WASM_HTTP_RUNNER_IDS`
#      第一個就是它，走第 7 步直接推導出 `arcrun-http-request.{WORKER_SUBDOMAIN}
#      .workers.dev`——不查 RECIPES KV、不查 registry。（同檔 :95 那段註解也白紙黑字
#      寫著這一整類零件「從未被 submit 過，也不需要」。）
#
#   ② **`body_json:` 沒有 `body_template:` vs 裸 `body:` 那個跳脫問題。**
#      那個問題是 recipe 專屬的（component-loader.ts:402 對 recipe 做
#      `interpolate(JSON.stringify(定義))`＝先序列化再字串替換）。
#      節點走的是完全不同的一條路：`graph-executor.ts:297` 的 `interpolateData`
#      **在物件結構上逐值替換**（:711 `interpolateValue` 遞迴），替換完才由
#      `makeHttpRunner`（component-loader.ts:270）整包 `JSON.stringify(ctx)` 一次。
#      ⇒ 換行與雙引號由 JSON.stringify 正確跳脫，**順序天生就是對的那一種**。
#      零件那端再 `json.Marshal(body_json)` 一次（registry/components/http_request/
#      main.go:77），仍然是「先組物件再序列化」。
#      `labels` 保持 `[493, 69]` 陣列原型別：`interpolateString` 的 single-ref
#      pass-through（graph-executor.ts:697）對「整串就是單一 {{x}}」回原值不 stringify。
#
#   ③ **`http_request` 的 `body_json` 是顯式白名單，不會被上游 ctx 污染。**
#      main.go 的 `Input` struct 只認 url/method/headers/body/body_json，其餘欄位
#      json.Unmarshal 直接丟掉（auth-recipe 零件則會把整個 ctx 攤平當 body ——
#      那個坑記在 gemini-generate.yaml 檔頭）。節點自己寫的 `url` 也永遠贏過 ctx 裡
#      同名的值（`mergedContext = {...ctx, ...resolvedData}`，resolvedData 在後）
#      ——這很重要：`after_issue` 的輸出帶著一個叫 `url` 的欄位（票網址），
#      若沒有這個順序，`notify` 會去打票網址而不是通知端點。
#
# ✅ 同時保留的舊結論（仍然成立，不要退回去）：
#   · 三個 code 節點一律 `component: code`，不是 `__CODE_URL__` 佔位——後者只有
#     安裝器那條路（installer/src/index.js:63 的 subsMap，對象是 *.local.yaml 編出的
#     workflows.json）會代換；本檔是 canonical `.yaml`，佔位不會有人代換。
#
# 🔴 notify 那一步是**已知打不通**的（不是這次弄壞的）：
#   `notify_leo_relay` 指向 leo21c（prod）的具名工作流，2026-09-20／09-21 兩次實打
#   都是 HTTP 404（總管 comment 10320、工人 comment 10351）。修它要動 prod ⇒ 不做。
#   **所以本版把「notify 失敗不影響票已開成」從註解變成圖的形狀**（見下方 flow 註解）：
#   舊版寫兩條 ON_SUCCESS 從 after_issue 分叉，看起來像兩條平行支線，
#   **但引擎不是這樣跑的**——`graph-executor.ts:484` 的出邊迴圈裡 `result` 是**共用變數**，
#   第一條邊跑完就把 `result` 覆寫掉，第二條 ON_SUCCESS 的 `if (!isFailure(result))`
#   讀到的是**第一條支線的結果**。⇒ notify 404 → finalize 整個被跳過 → 工作流回的是
#   notify 的失敗 → portal 找不到 `number` → 學員看到「沒送出去，請再試一次」
#   → **他會再送一次 ⇒ 每則回報開兩張票**。這是實讀引擎讀出來的，不是推測。

name: feedback_report
description: >
  學員／封測者在小幫手或 Portal 打字回報問題 → 在 inkstone/arcrun-rag 開一張票
  （label user + s/triage，標題＝原話不改寫，內文含回報原文＋回報者＋版本／實例／OS＋
  選填的診斷檔摘要）→ 開票成功才算送出成功；額外用 Telegram 通知 leo 一句話＋
  票連結（可失敗，不影響票已開成的事實）。不依賴任何私庫 recipe，推一次 workflow 即上線。

# 🔴 notify → finalize 有兩條邊（成功走一條、失敗走另一條），**這是刻意的**：
#    它讓 finalize 成為圖上唯一的終點，不管 notify 成敗都一定跑得到，
#    於是工作流最後回的永遠是「票號」那一包。理由見檔頭最後一段。
flow:
  - "input >> ON_SUCCESS >> prep"
  - "prep >> ON_SUCCESS >> create_issue"
  - "create_issue >> ON_SUCCESS >> after_issue"
  - "after_issue >> ON_SUCCESS >> notify"
  - "notify >> ON_SUCCESS >> finalize"
  - "notify >> ON_FAIL >> finalize"

config:
  # 1) 組標題／內文／labels。輸入驗證與內文組裝全部是純字串處理（決定性，無 IO）。
  prep:
    component: code
    code: |
      // 🔴 呼叫端沒帶的欄位，插值之後留下的是**字面** '{{input.x}}'，不是 undefined
      //    （graph-executor.ts:700：取不到值就回原字串）。不擋掉它，沒附診斷檔的票會印出
      //    一段 ```json "{{input.diagnostics}}"```、桌面小幫手送的票回報者會寫成
      //    「{{input.reporter}}」。這是靜默的——YAML 正常、工作流也回 success。
      var raw = function (v) {
        // 只認 {{input.x}}（本節點 input: 區塊裡就只有這一種模板），不要連 {{foo}} 一起吃掉
        // ——學員原話裡寫的大括號是**資料**，不是沒帶。
        if (typeof v === 'string' && /^\s*\{\{input\.\w+\}\}\s*$/.test(v)) return undefined;
        return v;
      };
      var clean = function (v, cap) {
        v = raw(v);
        if (v === undefined || v === null) return '';
        return String(v).replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, cap);
      };

      var text = String(raw(input.text) == null ? '' : raw(input.text)).trim();
      if (!text) return { success: false, error: 'feedback_report 缺 text（不能是空白回報）' };
      var version = String(raw(input.version) || 'unknown');
      var instance = String(raw(input.instance) || 'unknown');
      var os = String(raw(input.os) || 'unknown');
      var repo = String(raw(input.repo) || 'inkstone/arcrun-rag').trim().replace(/^\/+|\/+$/g, '');
      if (!/^[^\/\s]+\/[^\/\s]+$/.test(repo)) repo = 'inkstone/arcrun-rag';

      // 🔴 回報者：票上紅線「不能看起來像機器自己開的」。Portal 會帶（顯示名＋email，
      //    portal-data.ts 的 /portal/data/feedback），桌面小幫手沒有登入身分所以不帶
      //    ——那種情況誠實寫「桌面小幫手（本機，未具名）」，用下面那行實例／namespace 認人，
      //    不要假裝有名字。（缺這一格 ⇒ 同一台實例上每個學員開出來的票長得一模一樣。）
      var reporter = clean(input.reporter, 200);
      if (!reporter) reporter = '桌面小幫手（本機，未具名）';

      // 標題＝學員原話，只做機械處理（壓空白＋截斷），不是 AI 改寫。
      var title = text.replace(/\s+/g, ' ').trim();
      if (title.length > 200) title = title.slice(0, 200) + '…';

      var diag = raw(input.diagnostics);
      var diagBlock = '（沒有附上診斷檔）';
      if (diag !== undefined && diag !== null && diag !== '') {
        try { diagBlock = '```json\n' + JSON.stringify(diag, null, 2).slice(0, 6000) + '\n```'; }
        catch (e) { diagBlock = String(diag).slice(0, 6000); }
      }

      var body = '## 回報內容\n' + text +
        '\n\n## 回報者\n' + reporter +
        '\n\n## 環境\n- 版本：' + version +
        '\n- 實例／namespace：' + instance +
        '\n- 作業系統：' + os +
        '\n- 回報時間：' + new Date().toISOString() +
        '\n\n## 診斷檔\n' + diagBlock +
        '\n\n---\n學員透過小幫手／Portal「打字回報」送出（inkstone/arcrun-rag#210），' +
        '機器帳號代開；回報者＝上面「回報者」與「實例／namespace」兩行。';

      // notify 端點做成可覆寫的輸入：預設是 leo21c 那條既有的 notify_leo 具名工作流
      // （現況 404，見檔頭）；要換一條活的通知路時只要 trigger 帶 notify_url，
      // 不必改工作流、也不必動 prod。
      var notifyUrl = clean(input.notify_url, 500) ||
        'https://arcrun-cypher-executor.leo21c.workers.dev/webhooks/named/leo/notify_leo/trigger';

      return {
        success: true,
        repo: repo,
        api_url: 'https://git.uncle6.me/api/v1/repos/' + repo + '/issues',
        notify_url: notifyUrl,
        title: title,
        body: body,
        reporter: reporter,
        // 🔴 label id 只對 inkstone/arcrun-rag 有效（user=493／s/triage=69，2026-09-20 現查）。
        labels: [493, 69]
      };
    input:
      text: "{{input.text}}"
      version: "{{input.version}}"
      instance: "{{input.instance}}"
      os: "{{input.os}}"
      reporter: "{{input.reporter}}"
      diagnostics: "{{input.diagnostics}}"
      repo: "{{input.repo}}"
      notify_url: "{{input.notify_url}}"
    limits:
      timeout_ms: 2000
      max_output_bytes: 65536

  # 2) 真的開票。gitea_token 值由金鑰中心在執行前回填（D36），這裡只寫佔位。
  #    🔴 body 一律走 `body_json:`（物件），不要改成 `body:`（字串）——理由見檔頭②。
  create_issue:
    component: http_request
    method: POST
    url: "{{prep.data.api_url}}"
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
      Authorization: "token {{credential.gitea_token}}"
    body_json:
      title: "{{prep.data.title}}"
      body: "{{prep.data.body}}"
      labels: "{{prep.data.labels}}"

  # 3) 解析 Gitea 回應，拿到票號／網址，順便組好 Telegram 文案。
  #    🔴 `http_request` 的成功輸出是 {success:true, data:{body:"<回應原文字串>"}}
  #       （main.go 最後那段）⇒ 這裡要讀 `create_issue.data.body`，不是 `create_issue.data`。
  #       非 2xx 時零件回 {success:false,...} ⇒ ON_SUCCESS 邊不走 ⇒ 整條停在這之前，
  #       portal 讀不到 number 就誠實回「沒送出去」。開票失敗永遠不會被誤判成成功。
  after_issue:
    component: code
    code: |
      var issue = input.issue_raw;
      if (typeof issue === 'string') { try { issue = JSON.parse(issue); } catch (e) { issue = null; } }
      if (!issue || typeof issue.number !== 'number') {
        var msg = (issue && issue.message) ? String(issue.message) : '回應解析不出票號';
        return { success: false, error: '開票失敗：' + msg };
      }
      var title = String(input.title || '');
      var url = String(issue.html_url || '');
      return {
        success: true,
        number: issue.number,
        html_url: url,
        notify_text: '[封測回報] ' + title + '\n' + url
      };
    input:
      issue_raw: "{{create_issue.data.body}}"
      title: "{{prep.data.title}}"
    limits:
      timeout_ms: 2000
      max_output_bytes: 65536

  # 4) Telegram 通知（可失敗，見檔頭）。零金鑰，走 leo21c 個人實例既有的 notify_leo
  #    具名工作流；只帶一句話＋票連結，內容都在票上（不造第二份會漂的真相）。
  #    目標端點現況 404 ⇒ 這個節點**預期會紅**，而圖的形狀保證它紅了也走得到 finalize。
  notify:
    component: http_request
    method: POST
    url: "{{prep.data.notify_url}}"
    headers:
      Content-Type: "application/json"
    body_json:
      text: "{{after_issue.data.notify_text}}"

  # 5) 收尾＝圖上唯一的終點。不管 notify 成敗都會跑到這裡（兩條邊），
  #    所以工作流最後回給 portal／小幫手的永遠是「票號」那一包。
  #    notify_ok 只是順手告訴呼叫端 Telegram 那步的狀況，不影響 success。
  finalize:
    component: code
    code: |
      return {
        success: true,
        repo: input.repo,
        number: input.number,
        url: input.url,
        reporter: input.reporter,
        notify_ok: !!(input.notify_result && input.notify_result.success !== false)
      };
    input:
      repo: "{{prep.data.repo}}"
      number: "{{after_issue.data.number}}"
      url: "{{after_issue.data.html_url}}"
      reporter: "{{prep.data.reporter}}"
      notify_result: "{{notify}}"
    limits:
      timeout_ms: 2000
      max_output_bytes: 65536
