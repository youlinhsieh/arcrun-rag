# rag_takedown_direct — daemon 直送下架（v1「無 R2、無 Gitea」同步模式的刪檔配套）
#
# 為什麼要獨立一支（2026-07-20 live e2e 實撞定案）：
#   既有 rag_ingest 的 removed 分支在 collect_changed 有 __CARDS_PREFIX__ 閘（isCard：路徑必須
#   在 cards 前綴下），direct 模式的檔在資料夾根（如「加班規定.md」）→ 被閘擋掉、零下架。
#   → direct 模式自帶一支不含前綴閘的下架 workflow，按 page_name/path 精準 deprecate。
#   邏輯＝rag_ingest removed 分支的 kbdb 操作原樣搬過來（list_dead_blocks→build_deprecations→
#   deprecate_entry ＋ triplet 下架），但改成「單檔直鏈」（daemon 一檔一 POST，無 foreach）。
#
# dogfooding：下架＝kbdb **DELETE**（真刪 entries／records；2026-08-05 leo：「要可以刪除
#   KBDB 的存檔，先前只有 deprecated」——原檔已刪的卡沒有回溯價值，留著只讓庫變大），
#   全在 Arcrun workflow，daemon 只送 {page_name, path}。
#
# 觸發（daemon 偵測到刪檔）：
#   POST {cypher}/webhooks/named/__NAMESPACE__/rag_takedown_direct/trigger
#     -H "X-Arcrun-API-Key: __NAMESPACE__"
#     -d '{"page_name":"加班規定","path":"加班規定.md","library":"hr_docs"}'
#   library 選填（arcrun-rag#46）：帶了就只殺同一個庫的，避免兩個被監看資料夾裡
#   同名同相對路徑的檔互相連坐；舊版 daemon 不帶，行為與從前一致。
#   machine 選填（`inkstone/mira#6`）：同一條規則再上一層——帶了就只殺同一台機器的，
#   避免「A 電腦刪掉 notes.md」把 B 電腦上還活著的 notes.md 一起殺掉。
#
# 佔位參數：__NAMESPACE__ / __KBDB_BASE__ / __HTTP_REQ_URL__ / __CODE_URL__

name: rag_takedown_direct
description: >
  daemon 直送下架（v1 無 R2）：按 page_name 撈 kbdb blocks、逐筆核對 source_path 後
  **真刪**；對應 triplets（subject==頁名 或 source_uri==kb://path）一併真刪。
  （2026-08-05 由 deprecate 改真刪；順帶清掉既有的 deprecated 舊垃圾。）（task 11）

flow:
  - "input >> ON_SUCCESS >> prep"
  - "prep >> ON_SUCCESS >> list_dead_blocks"
  - "list_dead_blocks >> ON_SUCCESS >> build_deprecations"
  - "build_deprecations >> 對每個 dead_entry >> deprecate_entry"
  - "build_deprecations >> ON_SUCCESS >> list_triplets"
  - "list_triplets >> ON_SUCCESS >> pick_dead_triplets"
  - "pick_dead_triplets >> 對每個 dead_record >> deprecate_triplet"

config:
  # CJK page_name 進 URL query 前先 encodeURIComponent（agent-memory §7 實撞教訓）。
  prep:
    component: "__CODE_URL__"
    code: |
      const page = String(input.page_name == null ? '' : input.page_name).trim();
      if (!page) return { success: false, error: 'rag_takedown_direct 缺 page_name' };
      const path = String(input.path || (page + '.md'));
      // library（arcrun-rag#46）：選填。舊版 daemon 不會送，此時維持原本只看 path 的行為。
      const library = String(input.library == null ? '' : input.library).trim();
      // machine（`inkstone/mira#6`，leo 2026-08-18）：與 library 同一條規則、同一個理由，
      // 只是差一層——library 分得開「同一台機器的兩個資料夾」，machine 分得開「兩台機器」。
      // 選填：舊版 daemon 不送，此時行為與從前一字不差。
      const machine = String(input.machine == null ? '' : input.machine).trim();
      return { success: true, page_name: page, page_enc: encodeURIComponent(page),
               path: path, source_uri: 'kb://' + path, library: library, machine: machine };
    input:
      page_name: "{{input.page_name}}"
      path: "{{input.path}}"
      library: "{{input.library}}"
      machine: "{{input.machine}}"
    limits:
      timeout_ms: 2000
      max_output_bytes: 65536

  list_dead_blocks:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{prep.data.page_enc}}&owner_id=__NAMESPACE__&entry_type=block&limit=500"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  # 逐筆核對（防「同頁名不同卡」誤殺）：meta.source_path === 刪卡路徑，或 meta.source 以
  # kb://<路徑># 開頭；兩者皆無（老資料）＝fallback page_name 相等即殺（本清單已按 page_name 查）。
  #
  # 🔴 arcrun-rag#46（2026-08-16）加第二道：**library 相符才殺**。
  #   為什麼 path 相符還不夠：path 是**相對於被監看資料夾**的路徑。兩個被監看的
  #   資料夾各自放著 `notes.md` 時，兩邊的 page_name 與 path 完全一樣
  #   ⇒ 撤除其中一個會把另一個還在用的一起殺掉。巢狀資料夾（A 與 A/sub 同時被看守）
  #   是同一個病的另一種形狀。library 是逐資料夾導出的（collector libraryFor），
  #   ingest 寫進 metadata_json 時就帶著它 ⇒ 拿它當第二把鍵，兩份才分得開。
  #   （同 pick_dead_triplets 2026-08-16 那次的形狀：比對忽略某一維 ⇒ 誤傷別份。）
  #   只在**兩邊都有** library 時才收緊——payload 沒帶（舊版 daemon）或卡上沒有
  #   （改版前的舊資料）都退回原本的行為，不會把既有的撤除路變成撤不掉。
  build_deprecations:
    component: "__CODE_URL__"
    code: |
      function parse(b) { if (typeof b === 'string') { try { return JSON.parse(b); } catch (e) { return null; } } return b; }
      const a = parse(input.blocks_body);
      const entries = (a && a.entries) || [];
      const path = String(input.path || '');
      const lib = String(input.library || '');
      const mach = String(input.machine || '');
      const kbPrefix = 'kb://' + path + '#';
      const dead_entries = [];
      for (const e of entries) {
        let meta = {};
        if (e.metadata_json) { try { meta = JSON.parse(e.metadata_json) || {}; } catch (err) { meta = {}; } }
        // 2026-08-05 改真刪後拿掉「跳過已 deprecated」：那些舊垃圾正是要清的對象，
        // 留著跳過等於永遠清不掉（實測 youlin 374 blocks 裡有 23 筆）。
        const mPath = String(meta.source_path || '');
        const mSrc = String(meta.source || '');
        const hasPath = mPath !== '';
        const hasKbSrc = mSrc.indexOf('kb://') === 0;
        let hit;
        if (hasPath || hasKbSrc) {
          hit = (hasPath && path && mPath === path) || (hasKbSrc && path && mSrc.indexOf(kbPrefix) === 0);
        } else {
          hit = true;
        }
        // arcrun-rag#46：library 兩邊都有才比；不一致＝別的資料夾的同名檔，不准動。
        const mLib = String(meta.library || '');
        if (hit && lib !== '' && mLib !== '' && mLib !== lib) hit = false;
        // `inkstone/mira#6`：machine 同一條規則（兩邊都有才收緊）。少了這一維，
        // 「A 機器刪掉 notes.md」會把 B 機器上還活著的 notes.md 一起殺掉。
        const mMachine = String(meta.machine || '');
        if (hit && mach !== '' && mMachine !== '' && mMachine !== mach) hit = false;
        if (!hit) continue;
        dead_entries.push({ id: e.id });   // 真刪只需要 id
      }
      return { success: true, dead_entries: dead_entries, dead_count: dead_entries.length };
    input:
      blocks_body: "{{list_dead_blocks.data.body}}"
      path: "{{prep.data.path}}"
      library: "{{prep.data.library}}"
      machine: "{{prep.data.machine}}"
    limits:
      timeout_ms: 5000
      max_output_bytes: 4194304

  # 🔴 2026-08-05 改真刪（leo：「要可以刪除 KBDB 的存檔，先前只有 deprecated」）：
  #   原本 PATCH 成 status=deprecated ⇒ 資料**永遠留在庫裡**，只是查詢時被濾掉。
  #   實測 youlin：374 個 block 裡 23 筆是 deprecated 垃圾（6%），且只會越積越多
  #   ——原檔都刪了，這些卡沒有回溯價值，留著只是讓庫變大、備份變慢。
  #   kbdb 本來就有真刪（entries.ts:214 / records.ts:84），不需要新機制。
  deprecate_entry:
    component: "__HTTP_REQ_URL__"
    method: DELETE
    url: "__KBDB_BASE__/entries/{{dead_entry.id}}"
    headers:
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  # 🔴 limit=100 不是 500：`http_request` 零件讀不回超過 64 KiB 的回應（緩衝區寫死
  # `make([]byte, 65536)`），越線整顆 WASM trap 成 `unreachable`，這個節點一失敗
  # 後面全部不執行。而這條撈的是**全租戶**三元組（KBDB 沒有按來源過濾的參數）⇒
  # 大小跟著租戶長大、遲早越線。分界線與算術見 `rag-ingest-card.local.yaml`
  # 的 `list_old_triplets`（`inkstone/arcrun-rag#104`，2026-08-27 實測）。
  list_triplets:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/records/by-template/triplet?owner_id=__NAMESPACE__&limit=100"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  # 比對規則（原：subject==頁名 或 source_uri==本卡 → 全下架，治 G9 主詞≠卡名缺口；
  # InkStoneCo#44 ⑩ 2026-08-16 改：那條規則對「同頁名、多路徑並存」是過寬的洞——
  # 資料夾搬移時，新舊路徑產出的三元組 subject 都等於同一個頁名，若只看 subject 就會把
  # 搬移後、根本還活著的新三元組一起殺掉（實測：對舊路徑補打下架，新路徑那筆也被清空）。
  # 修法照抄 build_deprecations 對 blocks 的做法：三元組**有帶 source_uri** 時只認精確比對，
  # 只有**完全沒有 source_uri**（沒被本次改版前的舊資料）才退回寬鬆的 subject 比對——
  # G9 的初衷（subject 文字可能跟頁名有落差、要用 source_uri 兜住）在「有 source_uri」分支
  # 依然成立（不看 subject，只看 source_uri 是否精確等於這次要下架的那個），沒有被削弱。
  pick_dead_triplets:
    component: "__CODE_URL__"
    code: |
      let body = input.body;
      if (typeof body === 'string') { try { body = JSON.parse(body); } catch (e) { body = null; } }
      let records = (body && Array.isArray(body.records)) ? body.records : [];
      const page = String(input.page_name || '');
      const srcUri = String(input.source_uri || '');
      const lib = String(input.library || '');
      const mach = String(input.machine || '');
      const dead_records = [];
      for (const r of records) {
        const v = (r && typeof r === 'object' && r.values && typeof r.values === 'object') ? r.values : null;
        // 2026-08-05：不再跳過 deprecated（改真刪後那些正是要清的舊垃圾）。
        if (!v || !r.record_id) continue;
        const vSrc = typeof v.source_uri === 'string' ? v.source_uri : '';
        let hit = vSrc !== '' ? (srcUri !== '' && vSrc === srcUri) : (v.subject === page);
        // arcrun-rag#46：與 build_deprecations 同一條規則——兩個資料夾各有同名同相對
        // 路徑的檔時，source_uri 也會完全相同，library 是唯一分得開它們的那一維。
        const vLib = typeof v.library === 'string' ? v.library : '';
        if (hit && lib !== '' && vLib !== '' && vLib !== lib) hit = false;
        // `inkstone/mira#6`：machine 同一條規則。⚠️ triplet template 沒有 machine slot 的
        // 實例，這一格永遠是空字串（KBDB 靜默丟掉未宣告的 slot）⇒ 退回舊行為，不會誤殺，
        // 但也擋不住跨機器連坐。補 slot 走 PORTAL_TEMPLATE_SEEDS（library 當初的那條路）。
        const vMachine = typeof v.machine === 'string' ? v.machine : '';
        if (hit && mach !== '' && vMachine !== '' && vMachine !== mach) hit = false;
        if (!hit) continue;
        dead_records.push({ record_id: r.record_id });
      }
      return { success: true, dead_records: dead_records, count: dead_records.length };
    input:
      body: "{{list_triplets.data.body}}"
      page_name: "{{prep.data.page_name}}"
      source_uri: "{{prep.data.source_uri}}"
      library: "{{prep.data.library}}"
      machine: "{{prep.data.machine}}"
    limits:
      timeout_ms: 3000
      max_output_bytes: 2097152

  # 同上，改真刪（2026-08-05）。
  deprecate_triplet:
    component: "__HTTP_REQ_URL__"
    method: DELETE
    url: "__KBDB_BASE__/records/{{dead_record.record_id}}"
    headers:
      Authorization: "Bearer {{credential.kbdb_internal_token}}"
