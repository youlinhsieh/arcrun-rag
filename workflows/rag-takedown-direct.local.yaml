# rag_takedown_direct — daemon 直送下架（v1「無 R2、無 Gitea」同步模式的刪檔配套）
#
# 為什麼要獨立一支（2026-07-20 live e2e 實撞定案）：
#   既有 rag_ingest 的 removed 分支在 collect_changed 有 cards 前綴閘（isCard：路徑必須
#   在 cards 前綴下），direct 模式的檔在資料夾根（如「加班規定.md」）→ 被閘擋掉、零下架。
#   → direct 模式自帶一支不含前綴閘的下架 workflow，按 page_name/path 精準 deprecate。
#   邏輯＝rag_ingest removed 分支的 kbdb 操作原樣搬過來（list_dead_blocks→build_deprecations→
#   deprecate_entry ＋ triplet 下架），但改成「單檔直鏈」（daemon 一檔一 POST，無 foreach）。
#
# dogfooding：下架＝kbdb **DELETE**（真刪 entries／records；2026-08-05 leo：「要可以刪除
#   KBDB 的存檔，先前只有 deprecated」——原檔已刪的卡沒有回溯價值，留著只讓庫變大），
#   全在 Arcrun workflow，daemon 只送 {page_name, path}。
#
# 觸發（daemon 偵測到刪檔）：
#   POST {cypher}/webhooks/named/__NAMESPACE__/rag_takedown_direct/trigger
#     -H "X-Arcrun-API-Key: __NAMESPACE__"
#     -d '{"page_name":"加班規定","path":"加班規定.md","library":"hr_docs"}'
#   library 選填（arcrun-rag#46）：帶了就只殺同一個庫的，避免兩個被監看資料夾裡
#   同名同相對路徑的檔互相連坐；舊版 daemon 不帶，行為與從前一致。
#   machine **必填**（`inkstone/mira#6` 引入、inkstone/arcrun-rag#273 改必填）：同一條規則再上一層——
#   只殺同一台機器的，避免「A 電腦刪掉 notes.md」把 B 電腦上還活著的 notes.md 一起殺掉；
#   沒帶就明確報錯（不再回成功卻什麼都沒刪）。
#   🔴 守門一律 `throw`，不是 `return { success:false }`：引擎的 isFailure 只看節點輸出的最外層，
#   code 零件把回傳值包成 `{success:true,data:{…}}`，內層 success:false 攔不住，ON_SUCCESS 照走
#   （youlin 1.4.110 實測，InkStoneCo#235 c21544 後續）。
#
# 佔位參數：__NAMESPACE__ / __KBDB_BASE__ / __HTTP_REQ_URL__ / __CODE_URL__

name: rag_takedown_direct
description: >
  daemon 直送下架（v1 無 R2）：按 page_name 撈 kbdb blocks、逐筆核對 source_path 後
  **真刪**；對應 triplets 由 KBDB 按來源（source_uri==kb://path）直接取 id 後一併真刪。
  （2026-08-05 由 deprecate 改真刪；2026-09-20 三元組那側改走 by-source，
  成本與租戶三元組總數脫鉤，見 list_triplets 註解。）（task 11）

# 🔴 inkstone/arcrun-rag#270：兩段刪除原本是 FOREACH 逐條依序（無並行）——stage 實測
#   100 條三元組＋10 block 要 317 秒，超過小幫手 300 秒上限；改版前存的大文件（148 條）
#   下架一定逾時。改成「並行 6」（引擎上限 6，與 rag_ingest_card 的 delete_entry／
#   delete_record 同一個寫法）。刪除彼此獨立（各自一個 id），並行不改語意。
flow:
  - "input >> ON_SUCCESS >> prep"
  - "prep >> ON_SUCCESS >> list_dead_blocks"
  - "list_dead_blocks >> ON_SUCCESS >> list_dead_blocks_p2"
  - "list_dead_blocks_p2 >> ON_SUCCESS >> list_dead_blocks_p3"
  - "list_dead_blocks_p3 >> ON_SUCCESS >> list_dead_blocks_p4"
  - "list_dead_blocks_p4 >> ON_SUCCESS >> list_dead_blocks_p5"
  - "list_dead_blocks_p5 >> ON_SUCCESS >> list_dead_blocks_p6"
  - "list_dead_blocks_p6 >> ON_SUCCESS >> list_dead_blocks_p7"
  - "list_dead_blocks_p7 >> ON_SUCCESS >> list_dead_blocks_p8"
  - "list_dead_blocks_p8 >> ON_SUCCESS >> list_dead_blocks_p9"
  - "list_dead_blocks_p9 >> ON_SUCCESS >> list_dead_blocks_p10"
  - "list_dead_blocks_p10 >> ON_SUCCESS >> build_deprecations"
  - "build_deprecations >> 對每個 dead_entry 並行 6 >> deprecate_entry"
  - "build_deprecations >> ON_SUCCESS >> list_triplets"
  - "list_triplets >> ON_SUCCESS >> pick_dead_triplets"
  - "pick_dead_triplets >> 對每個 dead_record 並行 6 >> deprecate_triplet"
  - "deprecate_entry >> ON_FAIL >> accept_entry_gone"
  - "deprecate_triplet >> ON_FAIL >> accept_triplet_gone"

config:
  # CJK page_name 進 URL query 前先 encodeURIComponent（agent-memory §7 實撞教訓）。
  prep:
    component: "__CODE_URL__"
    code: |
      // 🔴 inkstone/arcrun-rag#237（2026-10-05 實撞）：這支做的是**不可逆真刪**，
      //   必要輸入缺失、或仍帶著「沒被代換的佔位符」時，必須在刪任何東西**之前**就停。
      //   實撞：沒帶 path 觸發 ⇒ 引擎不代換、`{{input.path}}` 以字面字串進來，
      //   它不是 falsy（舊的 `input.path || 預設` 不接手），一路查到 `kb://{{input.path}}`
      //   並真刪命中的 record。⇒ 兩道：① page_name／path 都必填（不再默默補預設）
      //   ② 值裡只要還有 `{{…}}` 就當作沒代換、拒絕。
      //   daemon 一直都會送 path（collector/direct.go），正常觸發行為不變。
      //   library 是選填的收窄條件（缺了只會殺得更少）；machine 見下方，#273 起必填。
      function unresolved(v) { return /\{\{[^}]*\}\}/.test(v); }
      const page = String(input.page_name == null ? '' : input.page_name).trim();
      if (!page) throw new Error('rag_takedown_direct 缺 page_name，什麼都沒刪');
      const path = String(input.path == null ? '' : input.path).trim();
      if (!path) throw new Error('rag_takedown_direct 缺 path（原檔路徑），什麼都沒刪');
      if (unresolved(page)) throw new Error('rag_takedown_direct 的 page_name 仍是未代換的佔位符（' + page + '），什麼都沒刪');
      if (unresolved(path)) throw new Error('rag_takedown_direct 的 path 仍是未代換的佔位符（' + path + '），什麼都沒刪');
      // library（arcrun-rag#46）：選填。舊版 daemon 不會送，此時維持原本只看 path 的行為。
      const library = String(input.library == null ? '' : input.library).trim();
      // machine（`inkstone/mira#6`，leo 2026-08-18）：與 library 同一條規則、同一個理由，
      // 只是差一層——library 分得開「同一台機器的兩個資料夾」，machine 分得開「兩台機器」。
      // 選填：舊版 daemon 不送，此時行為與從前一字不差。
      const machine = String(input.machine == null ? '' : input.machine).trim();
      // 🔴 inkstone/arcrun-rag#273（2026-10-18 實撞，#269 c21346）：machine 不帶時引擎不代換，
      //   `{{input.machine}}` 以字面字串進來，build_deprecations 拿它去比 meta.machine ⇒ 全部「別台機器」
      //   ⇒ 一張都不殺（dead_count 0）、卻只刪了 triplet（triplet 那側不看 machine）：回成功，實際沒下架。
      //   machine 因此改為**必填**（現行 daemon 一律會送，collector/direct.go drainPendingTakedowns）。
      //   空的 machine 也不放行：空＝不收窄＝會連坐別台機器上同名同路徑的卡（inkstone/mira#6）。
      if (!machine) throw new Error('rag_takedown_direct 缺 machine（機器身分，如 youlinhsieh@Leo-MBA），什麼都沒刪');
      if (unresolved(machine)) throw new Error('rag_takedown_direct 的 machine 仍是未代換的佔位符（' + machine + '），什麼都沒刪');
      // src_uri_enc：list_triplets 要拿它去 KBDB by-source 查「這張卡自己的三元組」，
      // CJK 進 URL query 前必先 encodeURIComponent（同 rag_ingest_card 的 prep）。
      const srcUri = 'kb://' + path;
      // inkstone/arcrun-rag#255：概念卡／分段的三元組有自己的 source_uri（kb://路徑#t=<名字>，
      // 見 rag_ingest_card 的 triplet_scope）。帶了 triplet_scope 就只下架那一批；沒帶＝與從前一樣
      // （kb://路徑，也就是文件卡本人那一批，連同改版前所有卡共用這個 source_uri 時寫下的）。
      const rawScope = input.triplet_scope;
      const scope = (rawScope == null || unresolved(String(rawScope))) ? '' : String(rawScope).trim();
      const tripSrcUri = scope ? (srcUri + '#t=' + scope) : srcUri;
      return { success: true, page_name: page, page_enc: encodeURIComponent(page),
               path: path, path_enc: encodeURIComponent(path), source_uri: srcUri, src_uri_enc: encodeURIComponent(srcUri),
               trip_src_uri: tripSrcUri, trip_src_uri_enc: encodeURIComponent(tripSrcUri),
               library: library, machine: machine };
    input:
      page_name: "{{input.page_name}}"
      path: "{{input.path}}"
      library: "{{input.library}}"
      machine: "{{input.machine}}"
      triplet_scope: "{{input.triplet_scope}}"
    limits:
      timeout_ms: 2000
      max_output_bytes: 65536

  # inkstone/arcrun-rag#269 c21857（geek 1.4.111 實撞）：一張卡的 block 一頁撈不完。
  #   http_request 零件單次回應上限 64 KB，identity 檢視每個 block 仍有 ~530 B（出處、指紋、段數），
  #   一張疊了三份的大卡（147 block）＝78 KB ⇒ 「回應太大」整張卡寫不進去，而且越疊越大、
  #   重收這條路本身就清不掉。改成每頁 60 筆（約 32 KB，長檔名也留得住餘裕）、最多 10 頁（600 筆，
  #   超過就在 pick/build 節點明講失敗，不再靜默漏刪）。後面的頁沒資料時回應只有幾十 bytes。
  list_dead_blocks:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{prep.data.page_enc}}&owner_id=__NAMESPACE__&entry_type=block&view=identity&origin_path={{prep.data.path_enc}}&limit=60&offset=0"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  list_dead_blocks_p2:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{prep.data.page_enc}}&owner_id=__NAMESPACE__&entry_type=block&view=identity&origin_path={{prep.data.path_enc}}&limit=60&offset=60"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  list_dead_blocks_p3:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{prep.data.page_enc}}&owner_id=__NAMESPACE__&entry_type=block&view=identity&origin_path={{prep.data.path_enc}}&limit=60&offset=120"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  list_dead_blocks_p4:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{prep.data.page_enc}}&owner_id=__NAMESPACE__&entry_type=block&view=identity&origin_path={{prep.data.path_enc}}&limit=60&offset=180"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  list_dead_blocks_p5:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{prep.data.page_enc}}&owner_id=__NAMESPACE__&entry_type=block&view=identity&origin_path={{prep.data.path_enc}}&limit=60&offset=240"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  list_dead_blocks_p6:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{prep.data.page_enc}}&owner_id=__NAMESPACE__&entry_type=block&view=identity&origin_path={{prep.data.path_enc}}&limit=60&offset=300"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  list_dead_blocks_p7:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{prep.data.page_enc}}&owner_id=__NAMESPACE__&entry_type=block&view=identity&origin_path={{prep.data.path_enc}}&limit=60&offset=360"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  list_dead_blocks_p8:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{prep.data.page_enc}}&owner_id=__NAMESPACE__&entry_type=block&view=identity&origin_path={{prep.data.path_enc}}&limit=60&offset=420"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  list_dead_blocks_p9:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{prep.data.page_enc}}&owner_id=__NAMESPACE__&entry_type=block&view=identity&origin_path={{prep.data.path_enc}}&limit=60&offset=480"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  list_dead_blocks_p10:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/entries?page_name={{prep.data.page_enc}}&owner_id=__NAMESPACE__&entry_type=block&view=identity&origin_path={{prep.data.path_enc}}&limit=60&offset=540"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  # 逐筆核對（防「同頁名不同卡」誤殺）：meta.source_path === 刪卡路徑，或 meta.source 以
  # kb://<路徑># 開頭；兩者皆無（老資料）＝fallback page_name 相等即殺（本清單已按 page_name 查）。
  #
  # 🔴 arcrun-rag#46（2026-08-16）加第二道：**library 相符才殺**。
  #   為什麼 path 相符還不夠：path 是**相對於被監看資料夾**的路徑。兩個被監看的
  #   資料夾各自放著 `notes.md` 時，兩邊的 page_name 與 path 完全一樣
  #   ⇒ 撤除其中一個會把另一個還在用的一起殺掉。巢狀資料夾（A 與 A/sub 同時被看守）
  #   是同一個病的另一種形狀。library 是逐資料夾導出的（collector libraryFor），
  #   ingest 寫進 metadata_json 時就帶著它 ⇒ 拿它當第二把鍵，兩份才分得開。
  #   （同 pick_dead_triplets 2026-08-16 那次的形狀：比對忽略某一維 ⇒ 誤傷別份。）
  #   只在**兩邊都有** library 時才收緊——payload 沒帶（舊版 daemon）或卡上沒有
  #   （改版前的舊資料）都退回原本的行為，不會把既有的撤除路變成撤不掉。
  build_deprecations:
    component: "__CODE_URL__"
    code: |
      function parse(b) { if (typeof b === 'string') { try { return JSON.parse(b); } catch (e) { return null; } } return b; }
      const entries = [];
      let blocksTotal = 0;
      for (const key of ['blocks_body', 'blocks_body_p2', 'blocks_body_p3', 'blocks_body_p4', 'blocks_body_p5', 'blocks_body_p6', 'blocks_body_p7', 'blocks_body_p8', 'blocks_body_p9', 'blocks_body_p10']) {
        const pg = parse(input[key]);
        if (pg && Array.isArray(pg.entries)) for (const e of pg.entries) entries.push(e);
        if (pg && Number(pg.total) > blocksTotal) blocksTotal = Number(pg.total);
      }
      if (blocksTotal > 600) throw new Error('這張卡在雲端有 ' + blocksTotal + ' 個 block，超過一次最多清 600 個的上限，請分次下架');
      const path = String(input.path || '');
      const lib = String(input.library || '');
      const mach = String(input.machine || '');
      const kbPrefix = 'kb://' + path + '#';
      const dead_entries = [];
      for (const e of entries) {
        let meta = {};
        if (e.metadata_json) { try { meta = JSON.parse(e.metadata_json) || {}; } catch (err) { meta = {}; } }
        // 2026-08-05 改真刪後拿掉「跳過已 deprecated」：那些舊垃圾正是要清的對象，
        // 留著跳過等於永遠清不掉（實測 youlin 374 blocks 裡有 23 筆）。
        const mPath = String(meta.source_path || '');
        const mSrc = String(meta.source || '');
        const hasPath = mPath !== '';
        const hasKbSrc = mSrc.indexOf('kb://') === 0;
        let hit;
        if (hasPath || hasKbSrc) {
          hit = (hasPath && path && mPath === path) || (hasKbSrc && path && mSrc.indexOf(kbPrefix) === 0);
        } else {
          hit = true;
        }
        // arcrun-rag#46：library 兩邊都有才比；不一致＝別的資料夾的同名檔，不准動。
        const mLib = String(meta.library || '');
        if (hit && lib !== '' && mLib !== '' && mLib !== lib) hit = false;
        // `inkstone/mira#6`：machine 同一條規則（兩邊都有才收緊）。少了這一維，
        // 「A 機器刪掉 notes.md」會把 B 機器上還活著的 notes.md 一起殺掉。
        const mMachine = String(meta.machine || '');
        if (hit && mach !== '' && mMachine !== '' && mMachine !== mach) hit = false;
        if (!hit) continue;
        dead_entries.push({ id: e.id });   // 真刪只需要 id
      }
      return { success: true, dead_entries: dead_entries, dead_count: dead_entries.length };
    input:
      blocks_body: "{{list_dead_blocks.data.body}}"
      blocks_body_p2: "{{list_dead_blocks_p2.data.body}}"
      blocks_body_p3: "{{list_dead_blocks_p3.data.body}}"
      blocks_body_p4: "{{list_dead_blocks_p4.data.body}}"
      blocks_body_p5: "{{list_dead_blocks_p5.data.body}}"
      blocks_body_p6: "{{list_dead_blocks_p6.data.body}}"
      blocks_body_p7: "{{list_dead_blocks_p7.data.body}}"
      blocks_body_p8: "{{list_dead_blocks_p8.data.body}}"
      blocks_body_p9: "{{list_dead_blocks_p9.data.body}}"
      blocks_body_p10: "{{list_dead_blocks_p10.data.body}}"
      path: "{{prep.data.path}}"
      library: "{{prep.data.library}}"
      machine: "{{prep.data.machine}}"
    limits:
      timeout_ms: 5000
      max_output_bytes: 4194304

  # 🔴 2026-08-05 改真刪（leo：「要可以刪除 KBDB 的存檔，先前只有 deprecated」）：
  #   原本 PATCH 成 status=deprecated ⇒ 資料**永遠留在庫裡**，只是查詢時被濾掉。
  #   實測 youlin：374 個 block 裡 23 筆是 deprecated 垃圾（6%），且只會越積越多
  #   ——原檔都刪了，這些卡沒有回溯價值，留著只是讓庫變大、備份變慢。
  #   kbdb 本來就有真刪（entries.ts:214 / records.ts:84），不需要新機制。
  deprecate_entry:
    component: "__HTTP_REQ_URL__"
    method: DELETE
    url: "__KBDB_BASE__/entries/{{dead_entry.id}}"
    headers:
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  # 🔴 治本（`inkstone/InkStoneCo#138`，2026-09-20）：原本這裡打
  # `/records/by-template/triplet?owner_id=…&limit=100`——撈的是**全租戶**三元組，
  # 再靠 pick_dead_triplets 逐筆比對。兩個病一起發作：
  #
  #   ① 貴：那條路由（kbdb `searchByTemplatePage`）一次呼叫會讀三輪整張 sheet 的成員——
  #      取 id（`WHERE rel_id='sys_belongs' AND dst_id=?` ＋ `ORDER BY created_at DESC`）、
  #      算 total（`countSheetMembers`：`limit=100` 且租戶三元組 ≥100 時**一定**會跑）、
  #      再 JOIN 回格子值。成本跟**租戶三元組總數**成正比，與「刪的是哪張卡」無關。
  #      leo21c 2026-09-20 03:50 刪 9 張卡實測（`InkStoneCo#138` comment 10141）：
  #      那一格 546,054 讀列＝日額度 10.9%，而**前三名查詢的 SQL 字串只由這條路由發出**
  #      （`countSheetMembers` 只被 `searchByTemplatePage` 呼叫，後者只被
  #      `/records/by-template/:template` 呼叫，2026-09-20 讀 kbdb 原始碼核對）：
  #      COUNT 134,995 列／7 次＝19,285 列一次、格子 JOIN 64,800 列／30 次、身分 1,980 列。
  #   ② 刪不乾淨：`limit=100` 只拿「這個租戶**最新** 100 筆」⇒ 租戶三元組一過百，
  #      要刪的那張卡的三元組多半已被擠出視窗，**一筆都清不到**（同 `inkstone/Arcrun#12`
  #      在收卡端量到的 16,841 條殘留）。調大 limit 不是解：by-template 回完整 record，
  #      幾百筆就撞 `http_request` 零件 64 KiB 輸出上限（越線整顆 WASM trap 成
  #      `unreachable`，這個節點一失敗 `ON_SUCCESS` 後面全部不執行）。
  #
  # 新路＝收卡端 1.4.69 已經走通的那條（`inkstone/Arcrun#223`／PR #225，實測每卡
  # ≈60,000 讀列 → 287）：KBDB `GET /records/by-source/:template?field=&value=&owner_id=`
  # 伺服器端用 source_uri 精確比對（content 索引 → `idx_entries_rel_dst` 反查 → record id），
  # 成本只跟**這張卡自己的三元組數**成正比；只回 record_ids（≈40 bytes/筆），遠低於 64 KiB。
  # 回應帶 `total`（不受 limit 影響的命中總數），pick_dead_triplets 拿它跟 count 對帳。
  #
  # ⚠️ 兩道保護換掉了，誠實列出（見 pick_dead_triplets 的註解與 takedown-scope 測試）：
  #   · library／machine 的二次過濾（`arcrun-rag#46`／`inkstone/mira#6`）——by-source 只吃
  #     單一 field/value，回來的是 id 不是 values，沒有東西可以再比對。
  #   · 「完全沒有 source_uri 的舊三元組退回 subject 比對」——by-source 按 source_uri 查，
  #     查不到那種資料。要補回來需要 KBDB 那側配合（回完整 record，或吃多組 field/value），
  #     本票不跨 repo 動 kbdb，已回報在票上。
  list_triplets:
    component: "__HTTP_REQ_URL__"
    method: GET
    url: "__KBDB_BASE__/records/by-source/triplet?field=source_uri&value={{prep.data.trip_src_uri_enc}}&owner_id=__NAMESPACE__"
    headers:
      Accept: "application/json"
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  # `list_triplets` 已在**伺服器端**用 source_uri 精確比對過（見該節點註解），
  # 回來的是 `{ record_ids: [...], count, total }` ⇒ 這裡不再逐筆比對，只把 id 攤成
  # foreach 吃得到的形狀，並把 total 與實拿筆數對帳。
  #
  # 🔴 舊版在這裡做的三件比對，各自的去向（`InkStoneCo#138`，2026-09-20）：
  #   ① **有 source_uri 就只認精確比對**（`InkStoneCo#44` ⑩ 2026-08-16 修的那條：
  #      資料夾搬移後，新舊路徑產出的三元組 subject 都等於同一個頁名，只看 subject
  #      會把搬移後還活著的新三元組一起殺掉）——**保住了，而且更強**：現在精確比對
  #      在 D1 索引上做，連「別條路徑的三元組」都不會被撈回來，沒有誤殺的機會。
  #   ② **完全沒有 source_uri 的舊三元組退回 subject 比對**（G9 的兜底）——**沒了**。
  #      by-source 按 source_uri 查，查不到那種資料。要補回來得讓 KBDB 也能按 subject
  #      查、且回得出「這筆有沒有 source_uri」，那是 kbdb 那側的事，已回報票上。
  #   ③ **library／machine 的二次過濾**（`arcrun-rag#46`／`inkstone/mira#6`：兩個被監看
  #      資料夾各有同名同相對路徑的檔時，source_uri 會完全相同）——**沒了**，理由同 ②：
  #      回來的是 id，沒有 values 可比。這與收卡端 1.4.69 的取捨是同一個
  #      （`rag-ingest-card.local.yaml` 的 `list_old_triplets` 註解、
  #      `tests/machine-scope.test.mjs` 那一格），不是本票新開的破口。
  #      ⚠️ blocks 那側（`build_deprecations`）**完全不受影響**，library／machine
  #      兩道保護原樣留著——被換掉的只有三元組這一側。
  pick_dead_triplets:
    component: "__CODE_URL__"
    code: |
      let body = input.body;
      if (typeof body === 'string') { try { body = JSON.parse(body); } catch (e) { body = null; } }
      const ids = (body && Array.isArray(body.record_ids)) ? body.record_ids : [];
      const dead_records = ids.map(function (id) { return { record_id: id }; });
      // total＝KBDB 端不受 limit 影響的命中總數。拿不完（一張卡三元組破千）時
      // 留在輸出裡讓執行紀錄看得見，不要靜默少刪。
      const total = (body && typeof body.total === 'number') ? body.total : dead_records.length;
      return { success: true, dead_records: dead_records, count: dead_records.length,
               total: total, truncated: total > dead_records.length };
    input:
      body: "{{list_triplets.data.body}}"
    limits:
      timeout_ms: 3000
      max_output_bytes: 2097152

  # 同上，改真刪（2026-08-05）。
  deprecate_triplet:
    component: "__HTTP_REQ_URL__"
    method: DELETE
    url: "__KBDB_BASE__/records/{{dead_record.record_id}}"
    headers:
      Authorization: "Bearer {{credential.kbdb_internal_token}}"

  # inkstone/arcrun-rag#270：並行刪除時 stage 實測 162 條裡有 68 條回 404「not found」
  # （約 0.5 秒就回，成功的要 5 秒）——那筆已經不在了，而下架要的正是「不在」，
  # 不該讓整支 workflow 變成 HTTP 500（小幫手會當失敗再退避重送）。
  # 只認 404；其他錯（500、逾時、401）一律 throw 讓它照舊失敗——不把真的刪不掉也吞掉。
  # 為什麼用 throw：code 零件正常 return 永遠是外層 success:true，只有 throw 才是失敗信封
  # （見 rag-ingest-card 的 prep_cluster_wiki 註解，c15011）。
  accept_entry_gone:
    component: "__CODE_URL__"
    input:
      err2: "{{deprecate_entry.error}}"
    code: |
      const e = String(input.err2 == null ? '' : input.err2);
      if (/\b404\b/.test(e)) return { success: true, already_gone: true };
      throw new Error('deprecate_entry 失敗且不是 404：' + e);
    limits:
      timeout_ms: 2000
      max_output_bytes: 4096

  accept_triplet_gone:
    component: "__CODE_URL__"
    input:
      err2: "{{deprecate_triplet.error}}"
    code: |
      const e = String(input.err2 == null ? '' : input.err2);
      if (/\b404\b/.test(e)) return { success: true, already_gone: true };
      throw new Error('deprecate_triplet 失敗且不是 404：' + e);
    limits:
      timeout_ms: 2000
      max_output_bytes: 4096
