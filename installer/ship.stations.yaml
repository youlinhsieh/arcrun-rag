# ═══════════════════════════════════════════════════════════════════════════
# 站表 —— 一次出貨要走哪幾站，每一站的活是誰幹的
#
# 讀法：一次出貨＝理貨員照這張清單，從第 1 站走到最後一站。
#       stage 和 prod 走**同一張清單**，只有每站的參數不同（參數在 ship.targets.json）。
#       任何一站失敗 → 當場停下，後面不跑（一次出貨是一個版本，不接受部分成功）。
#
# 這張表**不是文件，是會被執行的東西**：`ship.mjs` 開跑前先讀它，對不上就 exit 2。
#   ① 站表的 id 要跟 ship.mjs 的步驟表**逐項一一對應**（順序也要一樣）
#      ⇒ 悄悄拿掉一站、或悄悄加一站而沒寫進這張表，都在任何動作發生前就被擋下
#   ② 底下「產出物」列的每一項，都必須被某一站處理到
#      ⇒ 2026-08-11 的教訓：`landing`（代寄信那台）不在站表裡 ⇒ 從沒被出貨過 ⇒ 而報告全綠
#   ③ 宣告 `用什麼: 本機` 的站，**必須**寫 `本機理由`
#      ⇒ D70 明文要求「判斷不該用工作流要寫明理由，不准默默寫成腳本」——這裡把它變成機械閘
#
# ── D70：我們自己的事，也要用 Arcrun 做（leo 2026-08-11）────────────────────
# leo 原話：「不同動作調用不同的函式，**這些函式我希望用 Arcrun 做**。」
# 判準：「**leo 打開工作流頁，看得到這件事嗎？看不到 ⇒ 它就不在 Arcrun 上。**」
#
# 所以每一站的 `用什麼` 只有兩種答案：
#   · `用什麼: <工作流名>` —— 這一站的活由 leo 自己 Arcrun 實例上的工作流去做
#   · `用什麼: 本機` ＋ `本機理由:` —— 那件事 Cloudflare Worker 物理上做不到，理由寫明
# 混合的站（本機做事、線上那段交給 Arcrun 查證）另外寫 `也調用:`。
#
# ── 這張表現在誠實的樣子（不要假裝）─────────────────────────────────────────
# ── 🔴 D73 重新分類（leo 2026-08-11，本檔第一版的理由多數是錯的）─────────────
# leo：「**Gitea 是我們的內部開發環境**，所以任何人在他本機進行開發，最後交貨都要送到 Gitea。
#       所以 **Arcrun 可以去做中間的工作，完全不用碰到本地。**」
# 判準：「這一站碰的東西，**只有某一台機器看得到嗎？** 是 → 那不是限制，是**還沒交貨**。」
#
# 用這個判準重掃一遍，結果跟第一版差很多——**第一版寫的多數是「東西現在放哪」，不是限制**：
#
#   已在 Arcrun　 2 站　purge／verify
#   物理限制　　 2 站　preflight（leo 親手放的保險檔＝人的同意）／github-release（同）
#   還沒交貨　　 4 站　public-docs／daemon-sync／daemon-check／docs-changelog
#   缺零件　　　11 站　build／parity／notes／version／readme／commit／push／pin／
#                     deploy／docs／mail-relay
#
# 🔴 **只有 2 站是真的搬不動**，其餘 15 站都是「還沒搬」。第一版我把它們全寫成
#   「要碰本機檔案」——最誇張的是 `build`，理由寫「Worker 碰不到本機的 `.worker-builds/`」，
#   而那個目錄**早就 commit 進 `Leo/Arcrun` 的 main**，匿名讀 200，Arcrun 實測也真的讀到了。
#
# ⇒ 所以 `為什麼不搬` 現在是**三選一**（機械閘會擋自由作文），
#   且非物理限制的一律要寫 `要搬需要` ⇒ 每個沒搬的站都自帶一張待辦，賴不掉。
#
# 底下這段是第一版的說法，留著當對照——**它就是被 D73 推翻的那種理由**：
#   **要碰 leo 這台機器上的東西**（git 工作區、esbuild、wrangler 憑證、leo 親手放的保險檔）。
# 這不是藉口，是這張票（`Leo/arcrun-rag#77`）刻意選的形狀——leo 說「先做本地版」。
# 還沒接上 Arcrun、但接得上的，底下標了 `未來:`（現在有兩站：文件站、郵差）。
# 🔴 站表裡任何「那張票還沒做完」的說法都要當**會過期的東西**看待：
#   `build` 那一站的理由 2026-08-11 就過期過一次——票面還是 `s/todo`，
#   但程式碼早就改成「取用 Arcrun 官方成品」而不是自己編了。**動工前去查現況，不要照票面假設。**
#
# ── 一個刻意沒做的事，先講明別讓它變成默認 ─────────────────────────────────
# D65 補④（leo 08-11 下午）說「**站要照本質動作命名，不是照實作命名**」，
# 而 `ship-plugin-example.md` 據此把 18 站收成 15 站。**這張表沒有收**，19 站原樣保留。
# 理由：站表要能當閘用，就必須跟 ship.mjs 的步驟表**逐項對得上**；改名＋併站＝動 19 個
# 步驟的結構，而 leo 此刻正等著出貨（桌面小幫手還卡在 v0.18.25）。
# ⇒ 折衷：**id 保持與步驟表一致（可執行），`名字` 一律照本質動作寫（人看得懂）**。
#   例：`purge` 這一站的名字是「讓 CDN 拿到新版並確認它真的收斂了」，不是「purge」。
# 真正的併站／改名跟 `build` 這一站的消失是同一件事，屬 `Leo/Arcrun#80`＋`Leo/arcrun-rag#39`，
# 不在本張票（`#77` 明說「先做本地版，還不要做到 plugin」）。
# ═══════════════════════════════════════════════════════════════════════════

產品: arcrun-rag
描述: 個人／企業知識庫，裝在使用者自己的 Cloudflare 帳號上

# ── 這條出貨線跑在哪 ────────────────────────────────────────────────────────
# 🔴 `Leo/arcrun-rag#72` 揭露的兩個結構性斷點，本張票的處置是「**認了，並且擋死**」：
#   ① build 不可跨機器重現——雲端打出來的那份，地端重打打不出一樣的東西
#   ② 驗證章（來源釘子分支）只活在跑過 stage 的那台機器上
# ⇒ 不假裝修好跨機器。改成**宣告單機**，並讓「換一台機器接力」在結構上失敗、
#    而不是安靜地打出一份不一樣的貨。實作＝`installer/scripts/ship-machine.mjs`。
出貨機器:
  形態: 單機走完（stage 與 prod 都在同一台機器上跑，中途不換人接力）
  理由: |
    這條線有三樣東西綁死在一台機器上：Arcrun 來源 repo 的工作區（build 的輸入）、
    來源釘子分支 `ship/verified-stage`（stage 驗過的章，只在本機移動不推遠端）、
    以及 leo 親手放的 D20 保險檔。三樣都不是可攜的。
    與其做一套跨機器同步（那會多出三個會漂的東西），不如把「同一台」變成硬條件。
  怎麼擋: |
    stage 成功蓋章時把機器指紋寫進 `installer/release-state.json`；
    prod 出貨前比對「蓋章的那台 == 現在這台」，不符當場拒絕，訊息直說要回那台跑。

# ── 這個產品有哪些「會被使用者碰到的東西」 ──────────────────────────────────
# 🔴 這裡列的每一項都必須被下面某一站處理到，否則 ship.mjs 拒絕開跑。
產出物:
  - id: 零件包
    是什麼: 使用者安裝時下載的那包（引擎、資料層、19 顆零件、MCP、portal 前端——Arcrun 這一版編出來的全部）
    由誰處理: [fetch-artifacts, no-local-build, parity, commit, push]
  - id: 桌面小幫手
    是什麼: 使用者下載安裝的那個 App（mac .dmg／win .exe）
    由誰處理: [daemon-sync, daemon-check, daemon-source-check, verify]
  - id: 安裝器
    是什麼: 使用者按「開始安裝／更新」的那個網站
    由誰處理: [pin, deploy, verify]
  - id: 說明文件站
    是什麼: 使用者查「這版改了什麼」的地方
    由誰處理: [docs-changelog, docs, verify]
  - id: 中央服務
    是什麼: 代寄信等所有實例共用的那台（按「忘記密碼」會打到它）
    由誰處理: [mail-relay]
    註: 2026-08-11 以前它不在站表上 ⇒ 從沒被出貨過 ⇒ 而報告全綠。它就是這條規則的來由。
  - id: 公開說明
    是什麼: README／安裝手冊／導覽——使用者讀得到、過期就是騙人
    由誰處理: [public-docs, readme]
  - id: 版本發佈紀錄
    是什麼: |
      使用者想知道「這版改了什麼」時去讀的那一頁——**每個環境各有自己的一份**：
      prod 的封測者看 GitHub 版本發佈；stage 的內部封測者看 Gitea 版本發佈。
      leo 2026-08-16：「changelog 直接看 github，**如果在 stage 直接看 gitea**，
      不要花力氣維護兩個地方。」兩份的內容同源（docs-site 的 changelog），不各自維護。
    由誰處理: [release-record, release-check]
    註: |
      2026-08-16 以前這一項叫「公開發佈紀錄」、只指 GitHub 那一份 ⇒ 於是 stage
      根本不在這個產出物的涵蓋範圍內，**而它一樣有真的使用者**（封測者）。
      名字綁死主機，漏掉的那一半就不會現形——同 `landing` 那次的形狀（arcrun-rag#88）。

# ── 站表：22 站，兩邊都走（2026-08-18 新增 release-check，arcrun-rag#88）────
站:

  - id: preflight
    名字: 對齊目標（打錯目標打不進去）
    用什麼: 本機
    為什麼不搬: 物理限制
    理由: |
      要讀的三樣東西全在 leo 這台機器上，Cloudflare Worker 拿不到：
      Arcrun 來源 repo 的 git 狀態（乾不乾淨、HEAD 是哪顆）、bundle repo 的 origin、
      以及 leo 親手放的 D20 保險檔 `.github-armed`。
      🔴 保險檔尤其不能搬上雲：那是「leo 本人此刻同意開炮」的物證，
      放到機器碰得到的地方＝AI 造得出來，這道閘就沒了。
    也調用: [ship_check_live]
    也調用說明: 這一站裡「線上現在是哪一版」那一段，交給 Arcrun 去看。
    驗法: |
      帳號／repo 座標與登錄簿相符；prod 且 --confirm 時保險已解且未過期；來源 repo 乾淨；
      成品新鮮度（送出去的執行檔＝這顆 commit 編的）；
      **資源規則閘**（Leo/Arcrun#97：安裝器不准自己照名字建資源——鏡射指紋／沒人自己建 CF 資源／
      真的接上共用規則／三種情境測試，見 installer/scripts/resource-rule-gate.mjs）；
      文案契約閘（leo 拍板拿掉的句子沒有回來）

  - id: public-docs
    名字: 掃公開樹：說明這一版的東西還成不成立（README／安裝手冊／Portal 導覽…）
    用什麼: 本機
    為什麼不搬: 還沒交貨
    要搬需要: |
      Leo/arcrun-rag 是 private repo（匿名讀 404 實測）⇒ Arcrun 讀不到待掃的檔。
            需要：① 待出貨的 commit 推上 Gitea（已做到）② 一把 Gitea 讀取憑證進 credential 中心（D36 路徑，值不經 AI）
    理由: 掃的是本機工作樹裡尚未公開的檔案，還沒有任何網址指得到它們，Worker 抓不到。
    驗法: 公開樹守門機制（scripts/publish-github.sh 的 sanitize 閘）全過

  - id: daemon-sync
    名字: 把本機最新已發佈的 daemon 產物搬進 bundle
    用什麼: 本機
    為什麼不搬: 還沒交貨
    要搬需要: |
      daemon 的 dmg/exe 只存在 leo 這台的 collector/cmd/arcrun-app/dist/。
            需要：簽章打包完**立刻把產物交到 Gitea**（例如 daemon 產物 repo 或 release 附件），
            Arcrun 才搬得動。🔴 這就是 chore/60 併不進來的同一個病——產物沒交貨就等於不存在。
    理由: 桌面小幫手是在 leo 這台編出來的（mac 要簽章、win 要打 exe），產物躺在本機硬碟上。
    驗法: bundle/daemon/ 底下的檔＝本機 dist 最新已發佈那一版，逐位元相同

  - id: daemon-check
    名字: 查證這一版的 daemon 真的在成品裡（逐檔算 sha256，不是比版號字串）
    由來: |
      🔴 2026-08-18 改寫（D95 第二輪，inkstone/InkStoneCo#40）。舊名字是
      「核對 bundle 的 daemon 版本＝changelog 最新已出版本」，而它有兩個病：
        ① **問錯檔案**：D95 第一輪把桌面版那條線搬進 collector/CHANGELOG.md 之後，
           這站讀的還是 docs-site（只剩雲端 1.4.x，沒有 v 前綴）⇒ 正則不中
           ⇒ 整站 status:'skip' ⇒ 出貨線照印 ✅ 而新 daemon 從不進 bundle。
        ② **只比版號字串**：wiki/trees/2026-08-17-today.md 記著
           「ship.mjs:797 只比版號字串就跳過整站，**msix 停在上一版卻報全綠**」。
           版號相同不代表內容相同——manifest 的平台欄位是「只加不刪」保留下來的。
      ⇒ 改成問磁碟上量得到的量。**這一站沒有「跳過」這個結果**：問不出來就是斷。
    用什麼: 本機
    為什麼不搬: 還沒交貨
    要搬需要: |
      bundle manifest 那半 Arcrun **已經讀得到**（實測 200，見票上輸出）；
            卡的是 changelog 在 private repo。給 Arcrun 一把 Gitea 讀取憑證，這站就能整個搬。
    理由: 比對的兩邊（本機 collector/CHANGELOG.md、本機 bundle 目錄的實體檔案）都是本機檔案。
    驗法: |
      十項事實逐項查，全過才放行（installer/scripts/daemon-in-bundle-gate.mjs）：
      daemon 宣告了自己的版本線（collector/DAEMON_LINE）／說明檔在宣告位置找得到／
      它宣告了一個**這條線上**的已發佈版本／manifest 存在／manifest 委任了 daemon／
      委任版本＝說明檔版本／必要平台（mac・win）齊／每個委任的檔案真的在 bundle 裡／
      每個檔案的 sha256 由**磁碟實檔重算**且等於 manifest 宣告值／每個檔案不是 0 位元組。
      擋下與放行都附一行到 installer/daemon-in-bundle-gate-log.md（InkStoneCo#48）。

      🔴 2026-08-18 第二輪（inkstone/arcrun-rag#88）新增第一項的理由：
      在此之前「哪一段 changelog 是 daemon 的」是靠**版本號有沒有 `v` 前綴**分辨的
      （daemon `v0.18.x` vs 雲端引擎 `1.4.x`）。leo 定的「對外號就是三個數字」一落到
      產生端，那個判別就無聲失效——閘不報錯，而是往下比對到**更舊的一版**
      ⇒ 打包出新版執行檔、manifest 卻宣稱舊版，21 站全綠。
      ⇒ 判別依據換成 collector/DAEMON_LINE 宣告的那條線（宣告出來的事實，不是外觀），
        而且**它缺席時這一站直接斷**——沒有線就沒有判別器。
      閘自己的演練：installer/scripts/daemon-in-bundle-gate.test.mjs（該擋 10 種、不該擋 8 種）。

  - id: daemon-source-check
    名字: 核對 changelog 宣告的那一版，成品就是照這份源碼打的（比指紋，不查歷史）
    由來: |
      2026-08-15 夜間：e7c715f／d4d79f1／91f6171 三顆 commit 全動了 collector/（daemon 源碼），
      changelog 最上面已發佈段卻還是 08-13 打包時戳的 v0.18.27——沒人戳新版、沒人重打包。
      daemon-sync／daemon-check 比的是 bundle vs changelog，兩邊當晚都沒人動 ⇒ 永遠對得上，
      `--target stage --confirm` 印出「⏭ 跳過：bundle 已是 changelog 最新已發佈版」，
      而使用者按「檢查更新」拿到的還是舊執行檔。本站補上鏈裡缺的那一段：
      changelog 最上面已發佈的版本 vs collector/ 源碼現況，不管 bundle 現況如何都比得到。
    改判法紀錄: |
      🔴 2026-08-18（inkstone/arcrun-rag#88）：從「查 git 歷史」改成「量指紋」。
      舊判法是 `git log <宣告那顆>..HEAD -- collector` 非空就擋。D95 第一輪把
      CHANGELOG.md 搬進 collector/（為了讓 collector/ 自足）之後，**「宣告新版本」
      這個動作本身就是在改 collector/** ⇒ 只改宣告的 commit 也被算成「源碼又動過」
      ⇒ 這一站擋自己，後面的 push／deploy／verify／release-record 一次都沒跑過。
      兩件事都對，疊起來成死結——衝突在**範圍重疊**，不在任何一方做錯。
      同一輪還查出第二個自鎖：daemon-version.py 原本「先記指紋、再寫 changelog」，
      於是帳本記的是還沒戳版那一刻的樹 ⇒ 同一輪的第二個平台打包一定被自己的閘擋下
      ⇒ 而本站上游的 daemon-sync 兩個平台都要，缺一不准出貨。
    用什麼: 本機
    為什麼不搬: 還沒交貨
    要搬需要: |
      比對的兩邊（changelog、collector/ 的工作區檔案內容）都是本機檔案；
            搬去 Arcrun 的前提與 daemon-check 相同——先解決 collector/ 在 private repo 的讀取權限。
    理由: 比對的兩邊（本機 changelog、本機 collector/ 的檔案內容）都是本機檔案。
    驗法: |
      問 collector 自己的版本產生器（daemon-version.py --source-state，唯讀）：
      changelog 最上面那一版**打包當下記下的原始碼指紋**，與**現在這棵樹算出來的**
      是不是同一個值（指紋＝collector/ 底下每個受版控檔案的路徑＋內容雜湊）。
      相同 ⇒ 通過；不同 ⇒ 中止並列出打包後改過／新增／刪掉的是哪幾個檔；
      問不出來（帳本演算法過期、沒有這一版的紀錄、兩邊對 changelog 住哪有分歧）⇒ 一律停。
      擋下與放行都附一行到 installer/daemon-freshness-gate-log.md（InkStoneCo#48）。
      閘自己的演練：installer/scripts/daemon-freshness.test.mjs（15 支，兩個方向各有案例）
      ＋ collector/cmd/arcrun-app/daemon-version.test.mjs 的 ⑦⑧⑨。

  - id: fetch-artifacts
    名字: 向 Arcrun 取用編好的零件（這一站不編任何東西）
    改名紀錄: |
      🔴 2026-08-15：這一站的 id 以前叫 `build`，**而它早就不 build 了**——
      檔頭、本站表、輸出訊息都這樣寫，只有名字還留在原地。
      leo：「install 會抓到同意 build 的東西」「刪掉出貨的 build 流程」。
      名字說一件事、實際做另一件，就是 08-14 災情的形狀（有人照著一段描述不存在機制的
      註解做決策）⇒ 名字改成它真正在做的事：**取貨**。要編請去 Arcrun（唯一產地，D91）。
      `installer/ship-report.json` 的歷史紀錄照舊留著舊 id——那是**當時真的叫什麼**。
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      材料**已經在 Gitea**：Leo/Arcrun 的 .worker-builds/ 匿名讀 200（實測），
            Arcrun 也真的讀到了它的零件清單。所以這站不是「碰不到本機檔案」——我上一輪寫錯了。
            缺的是：① 把檔案寫回 Gitea repo 的能力（Leo/Arcrun#89）② 算內容雜湊的零件（Leo/Arcrun#91）。
      ⚠️ 訂正：原本這裡還寫「缺比對零件」——**那是錯的**，實測 if_control 在 leo 那台跑得動（Leo/Arcrun#88）。
    理由: |
      🔴 訂正（2026-08-11，本張票動工時實查）：這一站**已經不編譯了**。
      `installer/scripts/build-bundles.mjs` 檔頭寫著「本檔不再自己跑 esbuild」，
      實際做的是讀 Arcrun repo 的 `.worker-builds/manifest.json`、把官方成品搬過來、核對指紋，
      找不到官方成品就硬停、不退回自己編。出貨輸出印的「讀到 Arcrun 官方成品：Arcrun@<sha>」就是它。
      ⇒ 留在本機的理由**不是「要跑編譯器」**（那個理由已經過期），而是：
        它是**本機檔案搬運**——從本機那個 Arcrun clone 的 `.worker-builds/` 複製到本機 bundle 工作區。
        Worker 碰不到這兩個本機目錄，而且「這個 clone 有沒有落後它自己的 main」這道閘
        也只有在本機讀得到 git 狀態才驗得了。
    現況: |
      `Leo/Arcrun#80`（生產端：Arcrun 統一編譯、成品固定放 `.worker-builds/`）
      ＋`Leo/arcrun-rag#39`（消費端：出貨端改成去取用）
      —— **程式碼都已經落地並且正在跑**，但兩張票在 Gitea 上**還是 `open`／`s/todo`**（2026-08-11 實查）。
      ⚠️ 票的狀態落後於現實 ⇒ 不要照票面假設「還沒做」，也不要照這段假設「已經結案」，去查現況。
      📌 2026-08-15 結案：步驟表裡那句「從來源**重打** bundle」以及站 id `build`
        都已經改掉（見上面「改名紀錄」）。**那句自承留了四天沒人動，
        而它描述的正是一個名字與行為不符的地方**——這種自承本身就是待辦，不是註腳。
    驗法: 每顆零件都來自 Arcrun 官方成品且指紋相符；版本號由內容指紋算出

  - id: no-local-build
    名字: 確認這些零件不是我們自己編的（成品只有一個產地：Arcrun）
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      比對的兩邊 Arcrun 都讀得到（`.worker-builds/` 匿名讀 200；bundle manifest 在 Gitea／GitHub 上），
            缺的是把「逐位元比對」做成零件（Leo/Arcrun#91 雜湊零件）＋把結果寫回去（Leo/Arcrun#89）。
    理由: 要逐位元讀本機 bundle 工作區裡的檔案，Worker 碰不到那個目錄。
    驗法: |
      bundle 裡每一顆的位元組（含 wasm part）逐位元等於 Arcrun `.worker-builds/` 的官方成品；
      且出貨腳本自己沒有 import 任何打包器。
      🔴 **同一道驗證在 `commit` 站入庫前再跑一次**——這一站與入庫之間還隔著四站
      （notes／version／readme／daemon-sync）都會寫進 bundle 工作區。使用者拿到的是
      入庫的那一份，所以閘要貼著它，不是貼著中途的快照。
      🔴 這一站驗的是**來源**不是**寫法**——不管誰用什麼新方法在這裡產生零件都擋得住，
      而「照抄官方成品」是唯一會通過的做法。
    由來: |
      D91（leo 2026-08-14）：「今天開始出貨一律不准在 arcrun rag 或任何別的地方 build，
      這就是 arcrun 的專屬工作。你告訴我要把 cypher 搬到 arcrun，我說好，**結果搞到現在還用違反的方式**。」
      重點在後半句：規則早就講定、他也同意了，而實作至今仍在違反——**因為沒有任何東西在檢查**
      （同 D54／D64／D90 的形狀）。當時線上唯一的違規是 portal 前端：它不用打包器，
      是用字串拼出一顆 worker ⇒ 任何「掃有沒有人呼叫 esbuild」的檢查都抓不到它。

  - id: parity
    名字: 核對 bundle 內容＝唯一真相源（stage 與 prod 因此必然一一對應）
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      兩邊的 bundle manifest 都在 Gitea／GitHub 上，Arcrun 讀得到。
            判斷零件一直都在（實測 if_control 可用）。缺的是把比對結果寫回去的能力（Leo/Arcrun#89）。
    理由: 比對的是本機兩個 bundle 目錄的檔案內容。
    驗法: 兩邊零件清單逐項相符，數量相同

  - id: notes
    名字: 產生更新畫面那一行（來源＝changelog）
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      來源 changelog 在 private repo（等 Gitea 唯讀 token），寫回 manifest 等 Leo/Arcrun#89。
    理由: 從本機 changelog 檔算出來，寫進本機 bundle。
    驗法: 那一行不是空的，且來源是 changelog 不是人手打

  - id: version
    名字: 算版本並過機械閘（內容一變版本一定變；跨目標共用同一個號碼）
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      bundle 內容 Arcrun 讀得到；缺雜湊零件（Leo/Arcrun#91）＋寫回能力（Leo/Arcrun#89）。
    理由: 指紋是對本機 bundle 檔案內容算的。
    驗法: 內容指紋變了但版本沒變 → 失敗

  - id: docs-changelog
    名字: 確認這版已經寫進說明文件（缺了就中止，不安靜跳過）
    用什麼: 本機
    為什麼不搬: 還沒交貨
    要搬需要: |
      這站的判準就是「changelog 裡有沒有這一版的段落」＝純 contains 檢查，
            **現有的 ship_check_live 就做得到**，一顆新零件都不用。唯一卡點是 arcrun-rag 是 private。
            ⇒ 給 Arcrun 一把 Gitea 讀取憑證，**這是最快能整站搬走的一站**。
    理由: 讀的是本機 docs-site 原始檔（此刻還沒部署，線上還查不到）。
    驗法: changelog 原始檔裡有這一版的段落

  - id: readme
    名字: bundle repo 的 README 由零件清單算出來（不留會過期的手寫數字）
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      零件清單 Arcrun 讀得到；缺寫回能力（Leo/Arcrun#89）。
    理由: 產生並寫入本機 bundle repo 的檔案。
    驗法: README 的零件數＝實際零件數

  - id: commit
    名字: 把產物寫進 bundle repo 的版控
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      缺 Gitea 寫入 recipe（Leo/Arcrun#89）。Gitea 有這個 API，是我們還沒寫 recipe，不是做不到。
    理由: git 操作在本機工作區上，Worker 沒有工作區。
    驗法: 工作區乾淨，且這次產物都在版控裡

  - id: push
    名字: 推上 bundle repo
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      同 commit——走 Gitea API 就沒有「推」這個動作了（Leo/Arcrun#89）。
    理由: |
      推送憑證在 leo 這台的環境變數／git remote 裡。D36 金鑰鐵律：值不落地、不外流。
      要讓 Worker 推，就得把寫入憑證交給雲端保管——那是把風險放大，不是自動化。
    驗法: 遠端該分支的 HEAD ＝本次 commit

  - id: pin
    名字: 換安裝器釘子（真身是 wrangler.toml 的 vars）
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      改的是 repo 裡的設定檔，Arcrun 讀得到；缺 Gitea 寫入 recipe（Leo/Arcrun#89）。
    理由: 改的是本機 wrangler.toml。
    驗法: wrangler.toml 的釘子指向本次 commit

  - id: deploy
    名字: 部署安裝器（帳號由登錄簿釘死）
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      Cloudflare 有 Workers 上傳 API，Arcrun 打得到；缺一個「部署 Worker」的 recipe，
            以及部署憑證進 credential 中心。不是物理限制。
    理由: |
      `wrangler deploy` 要 Cloudflare 部署憑證。同 push：把部署憑證交給雲端保管＝放大風險。
      而且部署的目標帳號要由本機登錄簿釘死，才擋得住「打錯帳號」——這正是這條線最貴的教訓。
    也調用: [ship_check_live]
    也調用說明: |
      這一站判斷「要不要重複部署」用的線上現況，是 preflight 那裡由 Arcrun 去看回來的
      （`ctx.liveBefore`），不是本機自己 curl 的。部署完的查證在 verify 那站，同樣走 Arcrun。
    驗法: 從使用者端網址讀到的版本＝這一版

  - id: docs
    名字: 建＋部署說明文件站（並驗它真的是這份原始碼建的）
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      這站要跑 astro build（真的編譯一個靜態站）。Arcrun 的 code 沙箱不是建置環境。
            缺的是一個建置能力／建置服務——這是四項裡最接近物理限制的，但仍是能力缺口不是原理上不可能。
    理由: 同 deploy——建站與 `wrangler deploy` 需要本機工具鏈與部署憑證。
    未來: |
      🔴 誠實標記（2026-08-11）：這一站部署完的線上查證**還是本機做的**
      （`verify-docs.mjs` 的 `checkDocsLive`），還沒接上 `ship_check_live`。
      不是做不到——`ship_check_live` 的 `contains` 模式就是為這種 HTML 頁面查證設計的——
      是本張票先把 verify／purge 兩站接完並實測，這兩站沒接完之前不動它。
      ⚠️ 同一件事在 verify 那站**已經由 Arcrun 查過一次**（文件站是不是這份原始碼建的），
      所以現在不是沒人查，是查了兩次、其中一次還在本機。
    版本說明頁已經沒有了: |
      🔴 2026-08-17（leo「**這個頁面刪除**」，inkstone/arcrun-rag#41）：文件站
      **不再自己維護一份版本內容**。leo 2026-08-09 就講過「不要同步，docs 的版本說明
      直接連回 github 的版本發佈」，08-17 收口成三個字。

      現在的形狀：
        · 使用者讀的　　→ https://github.com/youlinhsieh/arcrun-rag/releases（唯一對外紀錄）
        · 雲端引擎 `1.4.x` 原稿 → repo 根的 `CHANGELOG.md`（**出貨用，不是網頁**）
        · 桌面版　 `v0.18.x` 原稿 → `collector/CHANGELOG.md`
        · `/docs/help/changelog/` → 一條轉去 GitHub 版本發佈的靜態轉址
          （`docs-site/astro.config.mjs` 的 `redirects`；接書籤與已部署的舊 HTML，
           repo 內的連結都已改成直接指 GitHub）

      🔴 **「使用者查得到這一版」那道閘沒有消失，它搬去 `release-record` 站**：
      每條版本線都要在 GitHub／Gitea 上有一筆版本發佈，內文由
      `installer/scripts/github-release.mjs` 的 `releaseSectionFor()` 從上面兩份原稿抽出來，
      抽不到就當場中止。⇒ 這一站的線上查證因此**變弱了**（只證明站是新的，
      不再證明內容含這一版）——那是頁面刪除的代價，差額由 release-record 承接，不是漏掉。

      ⚠️ 這一站的驗法變紅時，**不要為了讓它變綠而把版本說明頁加回 docs-site**。
    驗法: |
      `/docs/help/changelog/` 線上仍然把人送去 GitHub 版本發佈
      （meta refresh／canonical／Location 任一條指過去都算）——那條轉址是**這份原始碼的產物**，
      線上沒有它就代表這顆 worker 上的站不是這次建的（沒重建／沒 rsync／部署到別顆）。
      演練：`node --test installer/scripts/verify-docs.test.mjs`（6 支，含「轉址掉了」
      「轉去別的地方」「還是那一頁舊的版本說明」三種該紅的）。

  - id: mail-relay
    名字: 部署郵差（忘記密碼代寄），並驗證它真的接得起來
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      同 deploy——缺 Worker 部署 recipe（Leo/Arcrun#90）。
    理由: 同 deploy——`wrangler deploy` 需要本機部署憑證。
    未來: |
      🔴 誠實標記（2026-08-11）：同 docs——部署完「它接不接得起來」還是本機查
      （`verify-mail-relay.mjs`），還沒接上 `ship_check_live`。理由同上：先接完 verify／purge。
    驗法: 代寄端點存在且回應正常（不是 404）

  - id: purge
    名字: 讓送貨管道拿到新版並確認它真的收斂了
    用什麼: ship_refresh_cdn
    兩邊都走: |
      🔴 2026-08-12（Leo/arcrun-rag#79 第一個驗收條件）：**stage 也走這一站了。**
      在此之前條件是 `verify.fullChain`，而 fullChain 只有 prod 宣告 ⇒ stage 每次印
      「本目標不走 jsDelivr（登錄簿宣告）」跳過 ⇒ **這一站壞掉永遠只能在 prod 第一次發現**。
      2026-08-11 leo 解保險出 1.4.37 時它史上第一次真的被觸發，一次現形兩個
      （runWorkflow 沒被 import／工作流內建 FOREACH 撞 Cloudflare subrequest 上限）。
      ⚠️ 它在這張表的左右對照上**看起來是合法的**——stage 那欄是「登錄簿宣告沒這東西」
      ⇒ **只在單邊執行的站，是測試與 stage 的共同盲區**，件數對齊也看不出來。
      現在改由登錄簿的 `delivery` 宣告「這個目標的會移動的指標是什麼、怎麼踢它」，
      而 ship.mjs 的不變式 Ⅷ 規定**有安裝器就必須宣告** ⇒ 「本目標沒這東西」不再說得出口。
        · prod　＝ jsDelivr `@main`（作廢端點：purge.jsdelivr.net）
        · stage ＝ Gitea `raw/branch/main`（沒有作廢端點 ⇒ 帶 no-cache 強制重讀一次）
      演練：`node installer/scripts/ship.mjs --target stage --delivery-only`
           反向演練（應該要失敗）：前面加 `SHIP_DELIVERY_DRILL=1`
    驗法: |
      踢過之後重讀那個「會移動的指標」，讀到的 release 與 daemon 版本＝這一版；
      沒收斂就是使用者此刻拿不到新版，當場斷、後面不跑

  - id: verify
    名字: 驗收（用戶端視角，不是部署訊息）
    用什麼: ship_check_live
    也調用: [本機]
    也調用說明: |
      桌面小幫手那兩個安裝檔（8MB／22MB）的**逐位元比對**留在本機。
      理由：那要把整包下載下來算 sha256，Worker 的記憶體與回應大小裝不下這種東西。
      這是能力限制，不是不想做——其餘所有查證（版本號、釘點內容、文件站、代寄端點）都在 Arcrun 上。
    驗法: |
      使用者真的會走的每一條路都要有「實際看到什麼」的證據：
      安裝頁宣告的版本＝這一版／版本說明頁查得到這一版／下載得到的安裝檔＝釘點那一份

  - id: release-record
    名字: 在這個環境對應的 repo 留一份使用者點得到的版本發佈
    改名紀錄: |
      🔴 2026-08-16（arcrun-rag#88）：這一站的 id 以前叫 `github-release`。
      leo 看著 Gitea 的版本發佈頁問：「**你為什麼沒有發 Gitea 內部版本？**」
      實查：`gitea-release.mjs` 能用（`demo-88-v1.4.44` 就是三天前演練留下的），
      但登錄簿的欄位叫 `githubRelease`、條件只認 `publish` ⇒ **stage 兩個都不成立**
      ⇒ 這一站對 stage 永遠印「本目標沒有 githubRelease」跳過。
      ⚠️ 而它在出貨報告的左右對照表上**看起來是合法的**（理由是「登錄簿宣告沒這東西」）
      ——**只在單邊執行的站，是測試與 stage 的共同盲區**（不變式 Ⅷ 早就寫過這句）。
      名字綁死主機，就是漏掉那一半不會現形的原因 ⇒ 照本質動作改名，同 `build`→`fetch-artifacts`。
    兩邊都走: |
      🔴 2026-08-16 起 **stage 也走這一站**。兩邊的動作形狀一模一樣，只有目的地不同
      （leo：「**兩邊動作相同，不用這裡一套那裡一套。**」）：
        ① 先讓這一版的原始碼 commit 在該主機上看得到
           （prod ＝推公開鏡像；stage ＝把出貨分支交到 Gitea，D73）
        ② 再用 docs-site changelog 裡**同一段**內容建一筆版本發佈
      · prod  ＝ GitHub `youlinhsieh/arcrun-rag`（對外，受 D20 人閘管制）
      · stage ＝ Gitea `inkstone/arcrun-rag`（內部封測者看的，票與 PR 也在這裡）
      🔴 ①不是儀式：指到一顆只有某台機器看得到的 commit，leo 要的
        「票 → PR → commit → version 都有歷史可查」那條鏈就是斷的，而頁面看起來完全正常。
      🔴 出貨線**不代推 main**：stage 那半只推目前這個出貨分支；HEAD 在 main／master
        而 Gitea 上又還沒有這顆 commit ⇒ 當場斷，要人自己去併（那道閘是人的同意）。
      演練：`node installer/scripts/ship.mjs --target stage --release-record-only`
           （禁用在 publish 目標 ⇒ 這個模式碰不到 GitHub，開閘儀式一步都繞不過）
    用什麼: 本機
    為什麼不搬: 物理限制
    理由: |
      prod 那一半要用 GitHub 寫入憑證，且**受 D20 儀式管制**——它是整條線唯一一個
      「leo 親手解保險才准開炮」的動作。保險檔是本機檔案，憑證是本機環境變數。
      把它搬上雲＝那道人閘從此可以被機器繞過。**這一站永遠留在本機，不是暫時的。**
      （stage 那一半打的是 Gitea API，本身搬得動；但兩半是同一站、同一段程式碼，
      而這一站的去留由其中不可搬的那一半決定——拆成兩站才是這次要修掉的病。）
    驗法: 那一版的發佈頁點得開，且內文就是 changelog 裡這一版的段落

  - id: release-check
    名字: 回頭查證：每條版本線在產品 repo 都真的有版本發佈（不聽上一站說）
    為什麼有這一站: |
      🔴 2026-08-18（inkstone/arcrun-rag#88）。leo：「檢查為什麼會斷，建立下次無法斷的強制機制」。

      病況：daemon 做到 `v0.18.29`，對外點得到的最新 daemon 版本卻是 **`v0.18.25`（08-09）**
      ——`v0.18.26`／`27`／`28`／`29` 四版公開端一筆都沒有。連續四次，沒有一站發現。

      真因是兩件事疊起來，兩件都不是「忘了」：
        ① **發佈不是以版本線為單位**：`release-record` 寫死 `tag = v${ctx.release}`
           （零件包版本 1.4.x）⇒ 一趟出貨只產一筆 release，不管送了幾條線。
           daemon 那條線有三站管**內容**（daemon-sync／check／source-check），
           **零站管它有沒有被發佈**。
           實證：`github-contact-log.md` 同一個任務三行，2026-08-16 18:53–18:55
           「推 prod：**daemon v0.18.28**（三平台）＋對應零件包」→ 唯一一筆是 `v1.4.46`。
        ② **僅有的那筆 daemon 發佈，發在沒人會看的地方**：`v0.18.25` 住在
           `youlinhsieh/arcrun-rag-bundles`（自我描述「Prebuilt worker bundles …
           served via jsDelivr」＝**CDN 倉庫，不是產品頁**），0 個附件。
           而它會落在那裡不是選擇——`github-contact-log.md` 第 68 行留著原始指令：
           任務名稱是「補上文件站與建置日」（跟發佈無關），指令是
           `R=youlinhsieh/arcrun-rag-bundles` … `gh release create 1.4.29 --repo "$R"`
           ——`$R` 早被同一個 shell 前面推 bundle 的動作設好了，release 就跟著去了。
           🔴 **發在沒人看的地方，斷不斷都不會有人察覺。** 這才是四版無聲的原因。

      ⇒ 判準必須有**兩半**：**每條線都有發佈**（治①）＋**發在產品 repo 不是產物倉庫**（治②）。
        只驗前半的話，把 release 丟回 bundles repo 一樣全綠——那正是 08-09 發生的事。
    與 release-record 的分工: |
      同 `daemon-sync`→`daemon-check` 的形狀：上一站負責「做」，這一站**不聽它說**，
      重新向 host 查一次現況。光有逐條發還不夠——斷更四版期間出貨線**每趟都跑到了**
      `release-record`，它只是發錯東西。所以要一個只看事實的判準。
    判準看事實不看字串: |
      🔴 「有哪幾條線」讀的是**使用者端真的會讀到的那份回應**（`GET /api/latest`
      的欄位投影），不是檔名、不是命令列裡有沒有出現某個詞。
      （由來：`stage-before-prod-guard` 第七次關鍵字誤攔——wiki 內文出現
      `arcrun-rag-bundles` 這個字串就被判成出貨而擋下 commit。）
      「發到對的地方」比的是「這個 repo 是不是登錄簿自己宣告的 `bundles.remote`」，
      不是猜名字裡有沒有 `bundles`。
    留痕: |
      🔴 擋下與放行**都記**一行到 `installer/release-line-gate-log.md`。
      由來 InkStoneCo#48：36 支閘只有 2 支會記錄自己擋了什麼 ⇒ 沒有成效紀錄，
      就無法知道這道閘到底有沒有在運作。只記擋下的話分母是未知的。
    用什麼: 本機
    為什麼不搬: 缺零件
    要搬需要: |
      一個能「查 GitHub／Gitea 的 release 清單並比對交付面版本線」的 Arcrun 零件。
      查詢本身是匿名唯讀（D20：讀一律放行），沒有憑證問題，純粹是還沒有那顆零件。
    理由: |
      比對的一邊（bundle manifest 的版本線）目前讀的是本機出貨工作區裡那份
      `~/.arcrun-ship/<目標>/manifest.json`——它就是這一趟**正要送出去**的那份，
      在 push 之前只有這台機器看得到。另一邊（release 清單）是公開端點，本來就搬得動。
      ⇒ 這一站是「一半本機、一半線上」，不是物理限制，是還沒有那顆零件（見「要搬需要」）。
    驗法: |
      `node installer/scripts/release-line-gate.mjs --target prod` ⇒ 不過就 exit 1。
      演練：`node --test installer/scripts/release-line-gate.test.mjs`（該擋／不該擋各數種）。
    拆分後這一站怎麼辦: |
      ⚠️ D95（leo 2026-08-18）：「`arcrun rag/collector` 改成 **`arcrun-collector` 獨立 repo，
      源碼和產出物放在一起**」「**bundle 也是屬於 arcrun 的 bundle，不是 RAG**」
      「你要從頭到尾**不要有很多扭曲**，因為你根本不記得你做的這些扭曲，**每次都要查**」。

      🔴 **先把「桌面小幫手這一個東西，現在散在幾個地方」列出來**
      （總管實查，2026-08-18；**這是 D95 動工「之前」的快照＝這件事的動機**，
       ②④ 已經被 D95 修掉，標在各該項底下。留著原文是因為拿掉它就看不出當初為什麼要拆）：
        ① 源碼　　　　`products/arcrun-rag/collector/`
        ② 版本真相源　`docs-site/src/content/docs/help/changelog.md`
           ——**跟零件包共用同一個檔**：49 個版本段裡 26 段是 daemon（`## v0.18.x`）、
             23 段是零件包（`## 1.4.x`），兩套編號交錯排在一起
           ✅ **已修（D95 第一輪＋2026-08-17 頁面刪除）**：daemon 那條搬去
             `collector/CHANGELOG.md`、零件包那條搬去 repo 根的 `CHANGELOG.md`，
             **那一頁本身已經刪掉**（leo「這個頁面刪除」，inkstone/arcrun-rag#41）——
             使用者改讀 GitHub 版本發佈。⇒ 這個落點消失了，不是搬到別處。
        ③ 建置產物　　`collector/cmd/arcrun-app/dist/`（gitignored，**且每個 worktree 各一份**）
           ——這個扭曲已經咬過一次：`daemon-dist.mjs` 這支模組**存在的唯一理由**
             就是「打包在 worktree A、出貨在 worktree B ⇒ 找不到 ⇒ 安靜跳過」
        ④ 一顆化石　　`collector/cmd/arcrun-app/dist/Arcrun-v0.18.3.dmg` **真的進了版控**
           （11.3 MB）——③ 的 gitignore 規則本身已經在漏
           ◐ **一半（D95 第三輪）**：同批漏進來的 `__pycache__/*.pyc` 已移出追蹤並補 ignore；
             那些 dmg／執行檔**還在**（`6b44784`／`e09f866`／`c6d7b2c` 的舊帳）——
             拿掉它們＝改寫歷史，屬「歷史要不要洗」那題，要 leo 拍板，沒人可以順手做。
        ⑤ 交付產物　　複製進 bundle repo 的 `daemon/` → `youlinhsieh/arcrun-rag-bundles`
        ⑥ 下載來源　　`raw.githubusercontent.com/…/arcrun-rag-bundles/<sha>/daemon/…`
           （不走 jsDelivr——它擋 `.exe`）
        ⑦ 對外發佈　　**現在等於沒有**；歷史上唯一那筆跑到 ⑤ 那個 CDN 倉庫
      ⇒ **一個桌面 App，七個落點、四個 repo。** leo 說的「每次都要查」就是這個。

      **拆成 `arcrun-collector` 之後，這一站的三項各自會怎樣：**
        · 「發到對的地方」對 **daemon 線失效**（好事）：源碼與產出物同處 ⇒
          「daemon 要發到哪」只剩一個答案。2026-08-09 那種意外
          （`$R` 還指著前一個推 bundle 的動作）**在結構上不可能再發生**。
          但這一項對**零件包線仍然有效**——零件包還是會經過 bundle repo。
        · 「每條線都有發佈」**完全不失效**：拆完之後 arcrun-rag 這條線仍然
          **advertise** 一個 daemon 版本（`/api/latest` 照樣吐 `daemon.version`，
          安裝器照樣把 dmg/exe 送給使用者）⇒ 仍然要問「我廣告的這一版，
          在 `arcrun-collector` 上有沒有對應的發佈」。
          🔴 差別只在**查哪個 repo**：`release-lines.mjs` 屆時要讓**每條線各自帶 repo**，
          而不是所有線共用 `releaseRecord.repoSlug`。那是拆分那張票要做的事。
        · 「留痕」與拆不拆無關。

      ⇒ **這一站不是純過渡品，拆完不要整支刪掉**：改的是「查哪個 repo」，不是「要不要查」。
      理由寫在這裡，免得日後留下一道沒人知道為什麼存在的閘（那本身也是一種扭曲）。

# ── 失敗處理 ────────────────────────────────────────────────────────────────
失敗處理:
  規則: 撞到就停，後面不跑
  理由: 一次出貨是一個版本，不接受部分成功
  報告: 停下來之後，後面的站在報告上標「前面斷了，沒跑」（⛔），不是空白

# ── 出貨報告 ────────────────────────────────────────────────────────────────
出貨報告:
  形式: 一張左右對照表（第一欄站名、第二欄 stage、第三欄 prod）
  產生時機: 出貨當下由機器自己產生（`installer/scripts/ship-report.mjs`）
  要顯示: [站數, 這次增減了哪些站, 每站在兩邊各自的成功或失敗, 兩邊的來源 commit 是否相同]
  兩欄件數: |
    兩欄的站數必須相同——這是這張表存在的理由。件數對不齊＝有一邊少走了一站。
    只出過一邊（另一邊還沒跑）不算對不齊，那是「還沒到比對的時候」。
  理由: 人寫的報告會挑好聽的講；機器產的表沒得挑
