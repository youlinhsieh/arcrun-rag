name = "arcrun-installer"
main = "worker.js"
compatibility_date = "2026-01-01"

# 🔴 D90（leo 2026-08-14 拍板「把 prod 補成跟 stage 一樣」）：
#   本行原本**只加在 [env.staging]**，理由寫「prod 的呼叫方是 custom domain
#   （install.arcrun.dev）不踩這條」。但 CF 的 1042 **看的是目標，不是呼叫方**——
#   而 prod 與 staging 同樣要去 fetch 用戶的 *.workers.dev cypher。
#   ⇒ 若那個理由不成立，**每個走正式安裝器的用戶都會在最後一步撞 404，
#     而我們永遠測不出來**（因為我們只在有 flag 的 stage 上測）。
#
#   D90 的規則：stage 與 prod 只准差「身分」（名稱／網址／憑證／環境標記），
#   **不准差「行為」**（flag、相容性設定、程式路徑）。
#   修法方向刻意選「把 prod 補成跟 stage 一樣」而不是「把 stage 的拿掉」——
#   所有測試都是在**有**這個 flag 的環境上做的，拿掉等於把驗過的改成沒驗過的。
compatibility_flags = ["global_fetch_strictly_public"]

# 用到 File / FormData 建 multipart 上傳；標準 Workers runtime 已支援，
# 這裡不需要 nodejs_compat。

# ---------------------------------------------------------------------------
# 存 OAuth state、session（token）、安裝進度——Durable Object（inkstone/arcrun-rag#217）
# ---------------------------------------------------------------------------
# 🔴 leo 2026-09-25：「KV 只要存在你就會去用，很可能把用戶的服務搞掛」——安裝器自己
#   （官方帳號）原本也綁一顆 KV namespace，這裡換成 Durable Object。程式碼裡照樣叫
#   `env.INSTALLER_KV.*`（見 worker.js 的 `InstallerStore`／`attachKvShim`），只是
#   背後接的東西從 KV namespace 換成 DO stub，行為（get/put/delete/list、TTL）不變。
#   遷移（`[[migrations]]`，見檔尾）對每個環境各自的 script 獨立套用一次。
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "INSTALLER_STORE"
class_name = "InstallerStore"

# t157：對方通道（staging）的 DO，唯讀用——偵測「同帳號被另一通道裝過」（雙通道互蓋警告）。
# 兩通道互不知情，youlin 07-31 就被 staging＋prod 各裝一半成混血實例。
# script_name 指向 staging 的 script（跨 script DO 綁定，該 script 要有同一個 class）。
[[durable_objects.bindings]]
name = "PEER_INSTALLER_STORE"
class_name = "InstallerStore"
script_name = "arcrun-rag-installer-staging"

# ---------------------------------------------------------------------------
# 過渡期唯讀 KV（inkstone/arcrun-rag#217 comment 11162 審出）——**不是永久雙寫**
# ---------------------------------------------------------------------------
# prod 這顆帳號上有現役用戶的 `deployed:<acc>:<sub>` 紀錄（見 worker.js
# `kvOverDurableObject` 檔頭註解）。DO 剛上線是空的，若直接拔掉這顆 KV binding，
# 每個舊用戶重新整理/更新時都會被誤判成「沒裝過」、被導去要辨識碼。
# ⇒ 綁定名從 `INSTALLER_KV` 改成 `INSTALLER_KV_LEGACY`（id 不變——同一顆 namespace，
#   只是換了個名字讓它變成「來源」而不是「主資料」），`attachKvShim` 接成
#   read-through：DO 找不到才問它，問到就寫回 DO，之後不再問。
#
# 🔴 **拔掉的時機**（別只憑記憶判斷，照這裡的條件核對）：
#   `deployed:` 系列紀錄的 TTL 是 365 天（見 worker.js `deployBundledWorker`），
#   代表最久要等一年這顆 namespace 才會完全空掉。但不必真的等一年——
#   活躍帳號通常在换 DO 後的頭幾週內就會有請求把自己的資料 read-through 搬完，
#   所以判準是「**觀察期內這顆 legacy binding 還有沒有被問到**」，不是等 TTL：
#     1. 部署後開始算起，找一段安全窗（建議 ≥60 天，涵蓋久久才回來更新一次的用戶）
#     2. 這段期間去查 CF Analytics（KV read 次數，這顆 namespace id 見上面 id 值）
#        是不是趨近於 0——`kvOverDurableObject.get/list` 只在 DO 沒有才會問它，
#        所以「還有讀量」＝還有東西沒搬完，「讀量掉到 0」＝該搬的都搬完了
#     3. 讀量掉到 0 之後，把這個 binding 整段刪掉、把 `worker.js` 的
#        `legacyKv` 參數改回不傳（或留著也無害，只是變成永遠用不到的分支）
[[kv_namespaces]]
binding = "INSTALLER_KV_LEGACY"
id = "2ff9a845e7f646dab7b1e3dd6707b77f"  # 就是原本的 prod INSTALLER_KV，資料原封不動

[[kv_namespaces]]
binding = "PEER_INSTALLER_KV_LEGACY"
id = "750c23faf0794d3db317c32f596df9a9"  # 原本的 staging-INSTALLER_KV（prod 這邊當唯讀對照用）

[observability]
enabled = true

# DO class 的遷移紀錄——CF 依「script 名稱＋這份 tag 清單」各自追蹤，三個環境是三個
# 不同的 script（見各 [env.*] 的 name），所以同一份 [[migrations]] 對三邊分別各套一次，
# 不會互相污染。
#
# 🔴 總管審出（inkstone/arcrun-rag#217 comment 11162）：`new_classes`（經典 KV 型儲存
# 的 DO）**要付費方案**——查過 youlin 帳號的 subscriptions（CF API），只有
# `images_v2_stream_basic`／`r2_paid`，沒有 Workers 付費方案 ⇒ `new_classes` 在 youlin
# 這種免費帳號**部署不了**。免費方案只有 SQLite 型儲存的 DO 能用，遷移語法是
# `new_sqlite_classes`——`InstallerStore` 用的 `state.storage.get/put/delete/list`
# 這組 API 在兩種後端上簽章完全相同（SQLite 只是內部儲存機制不同，不改介面），
# 所以只改這一行，`worker.js` 不用跟著改。
# 這個 class 本來就沒上線過（第一次部署），第一次就用 SQLite 型別，不會有「已經建好
# 又要換儲存形態」那種事後很麻煩的遷移。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["InstallerStore"]

# t156：安裝自續保底——cron 每 2 分掃自家 KV 的 paused_continue／停滯 running 續跑一輪。
# 頁面接力仍是主路徑；這裡保證「頁面關了安裝照樣走完」。掃自家 KV 非 GitHub 輪詢（D20 無涉）。
[triggers]
crons = ["*/2 * * * *"]

# ---------------------------------------------------------------------------
# prod 設定（P10，2026-08-07）：與 [env.staging.vars] 同一套機制。
#   下面三個值與 worker.js 的 DEFAULT_LANDING_BASE / DEFAULT_BUNDLE_BASE /
#   BUNDLE_BUILT 常數**完全相同**——只是把「唯一真相源」從程式碼常數搬到這裡，
#   本次部署對 prod 行為零改變。
#   觸發原因：leo 08-07「可以在測試時指到 gitea，正式時指到 github 嗎？」——
#   worker.js 的 bundleBase()/landingBase() 早就支援 env 覆蓋，但 prod 過去沒有
#   任何 vars，導致「換 bundle 來源」只能改程式碼常數，跟 staging 走的是兩套機制，
#   必然漂移（同 D36 金鑰鐵律點名的病）。
#   ⇒ **以後要換 prod 的 bundle 來源／landing 網址，只改這裡＋wrangler deploy，
#     不必動 worker.js**（跟 staging 換 [env.staging.vars] 同一個動作）。
[vars]
LANDING_BASE = "https://arcrun-landing.uncle6-me.workers.dev"
BUNDLE_BASE = "https://cdn.jsdelivr.net/gh/youlinhsieh/arcrun-rag-bundles@dc59a05557b5ce0c9c2ee6c77a36418660c61601"
BUNDLE_BUILT = "2026-09-22"
# arcrun-rag#29 驗收帶出的坑（2026-08-09）：導覽列「首頁／說明文件」以前整段寫死
# rag.arcrun.dev，staging 頁面因此把人導去 prod。這兩個是**人看的**網址（跟上面
# LANDING_BASE 那個後端 API 用的 workers.dev 網址不是同一件事），與 worker.js 的
# DEFAULT_SITE_BASE / DEFAULT_DOCS_BASE 常數完全相同——本次部署對 prod 行為零改變。
SITE_BASE = "https://rag.arcrun.dev"
DOCS_BASE = "https://rag.arcrun.dev/docs"

# ---------------------------------------------------------------------------
# 注意：本安裝器不需要任何 secret。
# OAuth client 是 PKCE public client，client_id 寫在 worker.js 常數區即可，
# 不存在 client_secret。請勿在此檔或程式碼中放入任何 token。
# ---------------------------------------------------------------------------

# 若要綁自訂網域，取消下面註解並改成你的網域。
# ⚠️ redirect_uri 必須與 OAuth app 註冊的完全一致，換網域要同步更新註冊。
# routes = [
#   { pattern = "install.example.com", custom_domain = true }
# ]

# ---------------------------------------------------------------------------
# staging 環境（D37，2026-07-31）：與 prod 完全分離的測試場。
#   部署指令＝ `npx wrangler deploy --env staging --config wrangler.toml`
#   - 獨立 worker 名＋獨立 InstallerStore DO（session/進度/金鑰記錄全不與 prod 共用，
#     inkstone/arcrun-rag#217：原本是獨立 INSTALLER_KV，換 DO 之後隔離方式不變——
#     每個 script 名下的 DO class 天生互相隔離，不需要額外設定）
#   - 不綁 custom domain（走 workers.dev）；OAuth redirect_uri 已 PATCH 加進
#     client 79b44eac 的註冊清單（staging workers.dev callback）
#   - BUNDLE_BASE 蓋掉 prod 釘點 → Gitea raw 釘 commit（不走 jsDelivr、不碰 GitHub）
#   - BUNDLE_BUILT＝釘點 manifest.built（D37 單一真相源：換釘點時跟著 manifest 改）
#   - DEPLOY_ENV=staging → 首頁版本字串帶 +staging，一眼分辨
# ---------------------------------------------------------------------------
[env.staging]
name = "arcrun-rag-installer-staging"
# P10（2026-08-07）：允許本 worker（在 workers.dev 上）直接 fetch 同帳號其他
# workers.dev worker（landing-staging），不再被 CF 1042 當成 self-fetch 擋下。
# 只加在 staging——prod 的呼叫方是 custom domain（install.arcrun.dev）不踩這條，
# 維持現狀、不動 prod 的 compatibility_flags。
compatibility_flags = ["global_fetch_strictly_public"]

[[env.staging.durable_objects.bindings]]
name = "INSTALLER_STORE"
class_name = "InstallerStore"

# t157：對方通道（prod）的 DO，唯讀用——雙通道互蓋警告（見 prod 段註解）
[[env.staging.durable_objects.bindings]]
name = "PEER_INSTALLER_STORE"
class_name = "InstallerStore"
script_name = "arcrun-installer"

# 過渡期唯讀 KV（同 prod 段那整套說明＋拔掉時機——這裡不重複整段，理由一樣）。
# staging 是測試場但仍可能有人測過、留下 `deployed:` 紀錄，同樣不能讓它們憑空消失。
[[env.staging.kv_namespaces]]
binding = "INSTALLER_KV_LEGACY"
id = "750c23faf0794d3db317c32f596df9a9"  # 原本 staging 自己的 INSTALLER_KV

[[env.staging.kv_namespaces]]
binding = "PEER_INSTALLER_KV_LEGACY"
id = "2ff9a845e7f646dab7b1e3dd6707b77f"  # 原本的 prod INSTALLER_KV（staging 這邊當唯讀對照用）

[env.staging.vars]
DEPLOY_ENV = "staging"
BUNDLE_BASE = "https://git.uncle6.me/inkstone/arcrun-rag-bundles-staging/raw/commit/6464f1c"
BUNDLE_BUILT = "2026-09-25"
# P10（2026-08-07）：改指回 landing-staging（獨立 SIGNUPS KV），不再打 prod。
# 08-07 實查：舊值 https://rag.arcrun.dev 讓 stage 的辨識碼驗證全部寫/查 prod 的
# SIGNUPS——prod 報名 19 筆裡 8 筆 @example.com 就是這樣污染進去的。
# landing-staging 已部署（landing/wrangler.toml [env.staging]），獨立 KV
# 8a19ffe38ae246929c563b530e5eb5f7，與 prod SIGNUPS(ab7b1520…) 完全分離。
LANDING_BASE = "https://arcrun-landing-staging.uncle6-me.workers.dev"
# arcrun-rag#29（2026-08-09）：導覽列「首頁」「說明文件」的人看網址，跟上面
# LANDING_BASE 分開覆蓋——不然 staging 頁面的導覽列會把人導去 prod（含剛做好的
# stage 文件站完全連不到，只能靠使用者自己記住裸網址）。
SITE_BASE = "https://arcrun-landing-staging.uncle6-me.workers.dev"
DOCS_BASE = "https://arcrun-docs-staging.uncle6-me.workers.dev/docs"

# 下面這行原本注解說「worker→同帳號 workers.dev 的 fetch 會被 CF 擋（1042 族）」，
# 因此當初才把 LANDING_BASE 繞去 prod 的 custom domain——這正是污染的根因。
# 真正的解法是這個 compatibility flag（Arcrun#33 同族坑，credential-primitives-wasm
# Phase 7／cypher-executor 已用過同一招，見 system-dev/wiki/mistakes.md 與
# docs/manual/uncle6-deploy-record.md §3）：開了之後同帳號 workers.dev↔workers.dev
# 的 fetch 就不再被當成 self-fetch 擋下，不必再繞去 prod 網域。
# 實測見本次交付回報（curl /auth/start?code=<真碼> 直接拿到 CF OAuth 302，
# 而不是 error=code_unreachable）。

[env.staging.observability]
enabled = true

[env.staging.triggers]
crons = ["*/2 * * * *"]  # t156 自續保底（同 prod）

# ---------------------------------------------------------------------------
# youlin stage（inkstone/Arcrun#190，2026-09-01）
#
# 為什麼要有第三個環境：上面兩個（prod／staging）**都住在 uncle6 帳號**，
# 而 uncle6 的憑證只有 leo 的機器有。雲端這台只有 youlin 的 token
# （`CLOUDFLARE_API_TOKEN_YOULIN_CC_USE`，帳號 1129efd7df2e8899d537e9c8fbabb6cb）
# ⇒ 沒有這一段，雲端做的安裝器改動**一次都部不出去、也就一次都測不到**，
#   只能交「離線測試綠了」——而本 repo 的紅線第一條就是「HTTP 200 不算驗過」。
#
# youlin 是 D37 定的 AI stage（`system-dev/wiki/agent-memory.md`：
# 「youlin 🟢 預設：AI 的 stage — AI 做實驗、跑整合測試、部署驗證的地方」）。
#
# 🔴 它跟 prod／staging 的差別只有「身分」（帳號、worker 名、KV、環境標記），
#    **行為設定一模一樣**（compatibility_flags、cron、observability 全部照抄）——
#    這是 D90 的規則：stage 與 prod 不准差行為，否則測過的跟出貨的不是同一個東西。
#
# 部署：
#   CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN_YOULIN_CC_USE \
#   CLOUDFLARE_ACCOUNT_ID=1129efd7df2e8899d537e9c8fbabb6cb \
#   npx wrangler deploy --env youlin-stage --config installer/oauth-prototype/wrangler.toml
#
# ⚠️ 這個環境的 callback 網址**沒有**註冊進 Cloudflare OAuth client 79b44eac
#    （註冊要 uncle6 那邊動手）⇒ 走到授權那一步會被 CF 拒。
#    所以它現在能驗的是「授權**之前**的整頁」與「部署本身」，不是完整安裝。
#    這件事誠實記在 inkstone/Arcrun#190 的回報裡，不要當成已經驗過。
# ---------------------------------------------------------------------------
[env.youlin-stage]
name = "arcrun-installer-youlin-stage"
compatibility_flags = ["global_fetch_strictly_public"]

[[env.youlin-stage.durable_objects.bindings]]
name = "INSTALLER_STORE"
class_name = "InstallerStore"

# 對方通道偵測（t157）在 youlin 沒有真正的「對方」——跟 DO 換版前的作法一樣，給一顆
# 空的自己的 DO（script_name 留白＝綁同一個 script 自己的 class），而不是指向 uncle6
# 的 namespace（跨帳號綁不上，而且那是別人家的資料）。
[[env.youlin-stage.durable_objects.bindings]]
name = "PEER_INSTALLER_STORE"
class_name = "InstallerStore"

# 🔴 故意不接 `INSTALLER_KV_LEGACY`（inkstone/arcrun-rag#217 comment 11161／11162）：
# 總管 2026-09-25 實查 youlin-stage 舊的 `INSTALLER_KV`（`fb717f4d…`），`deployed:`
# 前綴 0 筆——這顆是 09-25 才重建的、還沒有人真的走完部署，沒有東西可搬，
# 接了也只是白多一顆沒用到的 binding。prod／staging 才需要那段過渡。

[env.youlin-stage.vars]
DEPLOY_ENV = "youlin-stage"
BUNDLE_BASE = "https://git.uncle6.me/inkstone/arcrun-rag-bundles-staging/raw/branch/main"
BUNDLE_BUILT = "2026-09-25"
# inkstone/arcrun-rag#215：以前指回 uncle6 的 arcrun-landing-staging／arcrun-docs-staging
# ——那正是本票要拔掉的依賴（youlin stage 讀 uncle6 的 worker，就不算「資料和帳號完全分開」）。
# 現在指向同一批本票新部署、住在 youlin 帳號的 landing／docs stage worker。
# 🔴 2026-09-25 c11015 總管訂正：youlin 的 workers.dev 子網域是 `arcrun-yuga3bse`，
# 不是 `youlin-hsieh-dev`（那個子網域 09-07 起 DNS 已死，見 InkStoneCo
# system-dev/wiki/ops-facts.md／ISEP docs/cloud-session-bootstrap.md）。
# 第一版寫錯子網域，總管部署後 curl 實測 000 才抓到——這裡是修正後的值。
LANDING_BASE = "https://arcrun-landing-youlin-stage.arcrun-yuga3bse.workers.dev"
SITE_BASE = "https://arcrun-landing-youlin-stage.arcrun-yuga3bse.workers.dev"
DOCS_BASE = "https://arcrun-docs-youlin-stage.arcrun-yuga3bse.workers.dev/docs"

[env.youlin-stage.observability]
enabled = true

[env.youlin-stage.triggers]
crons = ["*/2 * * * *"]
