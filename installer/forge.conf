# forge.conf — 本 repo「票的正本」住哪一家，切換只改這一處（inkstone/InkStoneCo#234，母票 #232）
#
# 為什麼有這一處：票的正本從 Gitea（git.uncle6.me）搬到 leo21c 的 AHub。以前出貨線的 ARM 核對、
# 用戶回報、安裝器的來源網址各自寫死舊家；換家要找七八個地方，漏一個就是「切完才發現某條線還在寫舊的家」。
# 現在它們全部讀這一處（installer/scripts/forge-config.mjs），
# installer/forge-consumers.json 逐項標「已換／不必換＋理由」，forge-consumers.test.mjs 會擋：
# 有人在被追蹤的非 md 檔裡新寫一個 git.uncle6.me、卻沒登記進清單 ⇒ 紅。
#
# 讀法：環境變數 > 本檔。環境變數同名，臨時翻不必改檔（回退演練就是翻這一格）：
#     TICKET_FORGE=gitea node installer/scripts/ship.mjs ...
#
# 金鑰一律不放這裡（D36：只碰名字）。token 的名字：TICKET_FORGE_TOKEN｜AHUB_TOKEN｜GITEA_TOKEN_CLAUDE_CODE，值在環境。

# 票住哪：gitea ＝ 舊家（Gitea 形狀的 REST）；ahub ＝ 新家（直接打 Arcrun 的 AHub 具名工作流，不經本機橋）
TICKET_FORGE=gitea

# TICKET_FORGE=gitea 時用：Gitea 形狀後端的網址（不含 /api/v1）。
# 也可以填 ahub_bridge 的 http://127.0.0.1:8787——橋把 Gitea 形狀翻成 AHub，用戶端不必知道差別。
TICKET_FORGE_URL=https://git.uncle6.me

# TICKET_FORGE=ahub 時用：AHub 所在實例的 cypher 網址與 namespace（leo21c 的 bfezv28v 槽位，gitea-ops#3 c22797）。
AHUB_CYPHER_URL=https://arcrun-cypher-executor.leo21c.workers.dev
AHUB_NS=bfezv28v

# 版本發佈紀錄（release／附件）住哪：跟著上面的 TICKET_FORGE 走，不另設開關。
#   gitea → 照 installer/ship.targets.json 各目標宣告的 baseUrl；下面 RELEASE_FORGE_URL 填了就整批改打它。
#   ahub  → 建 release 打 AHub（Arcrun AHub 0.4.0 的 release 路由）；附件本體先寫 leo21c 的 R2，AHub 只登記指標
#           {name,size,sha256,url,r2_key}（總管裁定 InkStoneCo#234 c22852：同帳號、不新增基礎設施；對外下載不走這裡）。
#           R2 key＝releases/<owner>/<repo>/<tag>/<檔名>。寫 R2 的金鑰名：CLOUDFLARE_API_TOKEN_LEO21C_ARTIFACTS（值在環境，D36）。
RELEASE_FORGE_URL=
# TICKET_FORGE=ahub 時用：附件住的 R2（leo21c 帳號 id 與 bucket 名都不是祕密；與 gitea-ops#4 的 LFS 同一個 bucket）。
RELEASE_R2_ACCOUNT=51a01bfa2665bd7bc3fd080dc40cf3e1
RELEASE_R2_BUCKET=gitea-lfs
# 寫 R2 的金鑰「名字」（值在環境）。空＝CLOUDFLARE_API_TOKEN_LEO21C_ARTIFACTS；演練改打別的帳號時才填。
RELEASE_R2_TOKEN_ENV=
