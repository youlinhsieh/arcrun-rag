<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Arcrun</title>
  <!-- 🔴 共用底層：色票／字體／紙張紋理的**唯一真相源**是 arcrun-cis/css/arcrun-cis.css。
       leo 08-04：「不會這裡又寫了一個新的 CSS？前面剛剛才說過不要創造新的？」
       ⇒ 這份是複製進來給 build 用的，**要改配色去改 arcrun-cis/css/ 那份**。 -->
  <link rel="stylesheet" href="./src/arcrun-cis.css"/>
  <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
<div id="app">
  <!-- ── 左側邊欄（inkstone/arcrun-rag#240 c18254，Claude Design 稿）──
       最上面是各個 Cloudflare 帳號，下面是「連結另一個帳號」，最底固定是版本與更新、
       淺色／深色、「?」。帳號清單自己捲，底部三樣永遠在視窗內。 -->
  <aside id="side">
    <button class="brand" id="brandHome" title="回首頁" aria-label="Arcrun 首頁">
      <img class="wm-ink"   src="./src/assets/arcrun-lockup-h-ink-trimmed.png" alt="Arcrun"/>
      <img class="wm-paper" src="./src/assets/arcrun-lockup-h-paper-trimmed.png" alt="Arcrun"/>
    </button>

    <!-- 帳號清單由 JS 依帳號數動態產生 -->
    <nav id="nav"></nav>

    <div class="side-foot">
      <button class="navlink" id="navUpdate" title="檢查小幫手版本與更新">
        <span>版本與更新</span><span class="ver" id="ver"></span>
      </button>
      <div class="foot-row">
        <!-- 淺色／深色是不分帳號的共用功能，放這裡，不放在某個帳號頁。 -->
        <button id="themeBtn" title="淺色／深色">◐</button>
        <!-- 固定位置的求救入口（inkstone/arcrun-rag#210）：任何頁面都看得到。 -->
        <button class="help-btn" id="helpBtn" title="需要協助？" aria-label="需要協助？打字回報、匯出診斷檔、或查看文件與常見問題">?</button>
      </div>
    </div>
  </aside>

  <!-- ── 右側內容區（換頁）。沒有全站頁首：同步狀態是各帳號自己的事，在各帳號頁的名稱底下。── -->
  <section id="content">
    <main id="page"></main>
  </section>
</div>

<!-- 內嵌覆蓋層，不另開小視窗 -->
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script src="./src/main.js" type="module"></script>
</body>
</html>
