name: msix-launch-probe
# inkstone/arcrun-rag#387：Store 審核「啟動即當」的重現與驗證。
# 只在這條分支推送／手動時跑，不碰其他 repo、不 fan-out、沒有排程。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-muh91u]
    paths: ['ci/msix-probe/**', '.github/workflows/msix-launch-probe.yml']
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable sideloading
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowAllTrustedApps" /d "1"
      - name: Probe each msix
        shell: pwsh
        run: |
          foreach ($m in Get-ChildItem ci/msix-probe/*.msix | Sort-Object Name) {
            Write-Host "===================== $($m.Name) ====================="
            & ./ci/msix-probe/probe.ps1 -Msix $m.FullName -Out "$env:RUNNER_TEMP\out\$($m.BaseName)"
            Write-Host "===================== ROUND2 $($m.Name) ====================="
            & ./ci/msix-probe/round2.ps1 -Msix $m.FullName -Out "$env:RUNNER_TEMP\out\$($m.BaseName)-r2"
          }
          Write-Host "===================== SUMMARY ====================="
          Get-ChildItem "$env:RUNNER_TEMP\out" -Recurse -Filter result.txt | ForEach-Object { Write-Host "$($_.Directory.Name): $(Get-Content $_.FullName)" }
          Get-ChildItem "$env:RUNNER_TEMP\out" -Recurse -Filter events-application.txt | ForEach-Object { Write-Host "---- $($_.FullName)"; Get-Content $_.FullName | Select-Object -First 80 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: ${{ runner.temp }}/out
