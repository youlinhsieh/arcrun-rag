name: msix-launch-probe
# inkstone/arcrun-rag#387：Store 審核「啟動即當」的重現與驗證。
# 只在這條分支推送／手動時跑，不碰其他 repo、不 fan-out、沒有排程。
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-muh91u]
    paths: ['ci/msix-probe/**', '.github/workflows/msix-launch-probe.yml', 'collector/cmd/arcrun-app/**']
env:
  FIX_VERSION: '0.18.121'
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/cmd/arcrun-app/go.mod
          cache-dependency-path: collector/cmd/arcrun-app/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build exe (with fix, and without fix for A/B)
        shell: pwsh
        working-directory: collector/cmd/arcrun-app
        run: |
          $ld = "-X main.version=$env:FIX_VERSION -X arcrun-rag/collector.version=$env:FIX_VERSION"
          wails build -platform windows/amd64 -clean -ldflags "$ld"
          if (-not (Test-Path build/bin/arcrun-app.exe)) { throw 'fix build failed' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\exe" | Out-Null
          Copy-Item build/bin/arcrun-app.exe "$env:RUNNER_TEMP\exe\fix.exe"
          # 對照組：拿掉 #387 的修正、其餘逐字相同，再編一次
          Remove-Item webview_datadir.go
          (Get-Content main.go) | Where-Object { $_ -notmatch 'WebviewUserDataPath: webviewUserDataPath\(\)' -and $_ -notmatch 'winopts "github.com' } | Set-Content main.go
          wails build -platform windows/amd64 -clean -ldflags "$ld"
          Copy-Item build/bin/arcrun-app.exe "$env:RUNNER_TEMP\exe\nofix.exe"
          git checkout -- main.go webview_datadir.go
      - name: Repack msix (same manifest as submitted, version bumped)
        shell: pwsh
        run: |
          $makeappx = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($v in 'fix','nofix') {
            $d = "$env:RUNNER_TEMP\pack-$v"; Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue
            [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path ci/msix-probe/a-submitted-0.18.120.msix), $d)
            Remove-Item "$d\AppxBlockMap.xml","$d\[Content_Types].xml" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "$d\[Content_Types].xml" -Force -ErrorAction SilentlyContinue
            Copy-Item "$env:RUNNER_TEMP\exe\$v.exe" "$d\Arcrun.exe" -Force
            $m = Get-Content "$d\AppxManifest.xml" -Raw
            $m = $m -replace 'Version="0\.18\.120\.0"', "Version=`"$env:FIX_VERSION.0`""
            Set-Content "$d\AppxManifest.xml" $m -NoNewline
            $tag = if ($v -eq 'fix') { 'b' } else { 'c' }
            & $makeappx pack /o /d $d /p "ci\msix-probe\$tag-$v-$env:FIX_VERSION.msix"
          }
          Copy-Item "ci\msix-probe\b-fix-$env:FIX_VERSION.msix" "$env:RUNNER_TEMP\Arcrun-$env:FIX_VERSION-store.msix"
      - name: Enable sideloading
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowAllTrustedApps" /d "1"
      - name: Probe each msix
        shell: pwsh
        run: |
          foreach ($m in Get-ChildItem ci/msix-probe/*.msix | Sort-Object Name) {
            Write-Host "===================== $($m.Name) ====================="
            & ./ci/msix-probe/probe.ps1 -Msix $m.FullName -Out "$env:RUNNER_TEMP\out\$($m.BaseName)"
          }
          Write-Host "===================== SUMMARY ====================="
          Get-ChildItem "$env:RUNNER_TEMP\out" -Recurse -Filter result.txt | ForEach-Object { Write-Host "$($_.Directory.Name): $(Get-Content $_.FullName)" }
          Get-ChildItem "$env:RUNNER_TEMP\out" -Recurse -Filter events-application.txt | ForEach-Object { Write-Host "---- $($_.FullName)"; Get-Content $_.FullName | Select-Object -First 80 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: ${{ runner.temp }}/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-msix
          path: ${{ runner.temp }}/Arcrun-*-store.msix
